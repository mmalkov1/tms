<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>План / Факт · TMS Культтовари</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#00356B; --blue:#285E96; --red:#E82A2C; --cream:#F3F1EF; --cream-50:#F6F4F5;
          --cream-200:#EFEEEC; --cream-300:#E2DFDA; --cream-400:#D7D4D0;
          --text:#1D2B3A; --muted:#9A948A; --green:#2E8B57; --amber:#B8860B; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Open Sans',system-ui,sans-serif; color:var(--text); background:var(--cream); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--navy); color:#fff; padding:9px 16px; display:flex; gap:14px; align-items:center; }
  header h1 { font-size:15px; font-weight:800; display:flex; align-items:center; gap:9px; }
  header input { padding:7px 11px; border:1.5px solid rgba(246,244,245,.28); border-radius:9px; font:inherit; font-size:13px; background:rgba(246,244,245,.14); color:#fff; }
  header input::-webkit-calendar-picker-indicator { filter:invert(1); }
  .tabs { display:flex; gap:4px; background:rgba(246,244,245,.12); border-radius:11px; padding:3px; font-size:13px; }
  .tabs a { padding:5px 14px; border-radius:8px; color:#E8EDF4; text-decoration:none; font-weight:600; }
  .tabs a.on { background:#fff; color:var(--navy); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .icon-btn { width:36px; height:36px; padding:0; display:inline-flex; align-items:center; justify-content:center;
              background:transparent; color:#fff; border:1.5px solid rgba(246,244,245,.32); border-radius:10px;
              box-shadow:none; cursor:pointer; transition:background .15s,border-color .15s,box-shadow .15s; }
  .icon-btn:hover { background:rgba(246,244,245,.10); border-color:#fff; box-shadow:0 1px 3px rgba(0,20,50,.18); }
  .icon-btn:focus-visible { outline:none; border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.22); }
  .icon-btn svg { width:20px; height:20px; }
  .trk { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; user-select:none; }
  .sw { width:36px; height:20px; background:rgba(255,255,255,.3); border-radius:99px; position:relative; transition:background .15s; }
  .sw i { position:absolute; left:2px; top:2px; width:16px; height:16px; background:#fff; border-radius:50%; transition:left .15s; box-shadow:0 1px 3px rgba(0,53,107,.25); }
  .trk.on .sw { background:var(--green); } .trk.on .sw i { left:18px; }
  #layout { flex:1; display:flex; min-height:0; }
  #map { flex:1; }
  #panel { width:520px; overflow:auto; padding:10px; }
  .route-card { background:#fff; border-radius:13px; margin-bottom:10px; overflow:hidden;
                box-shadow:0 2px 12px rgba(0,53,107,.08); border-left:5px solid var(--rc, var(--cream-400)); }
  .route-head { color:var(--navy); padding:9px 12px; font-size:13px; font-weight:700;
                display:flex; justify-content:space-between; cursor:pointer; }
  .route-head > span:last-child { color:var(--blue); font-weight:600; }
  .rdot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:5px 8px; border-bottom:1px solid var(--cream-200); text-align:left; }
  th { color:var(--navy); background:var(--cream); font-weight:700; }
  tr:hover td { background:var(--cream-50); }
  .late { color:var(--red); font-weight:700; } .early { color:var(--green); font-weight:700; }
  .fok { color:var(--green); font-weight:700; }
  .fmv { color:var(--amber); font-weight:800; background:#FFF3D6; }
  .done td { opacity:.6; }
  .failrow { background:#FFF3D6; } .failrow:hover td { background:transparent; }
  .failtag { color:var(--amber); font-weight:800; }
  .gps-note { color:var(--amber); font-weight:700; }
  /* v51: нумеровані маркери точок на карті */
  .npt { width:24px; height:24px; border-radius:50%; border:2.5px solid #fff; color:#fff;
         font:800 11px 'Open Sans',sans-serif; display:flex; align-items:center; justify-content:center;
         box-shadow:0 1px 4px rgba(0,0,0,.35); }
  /* v51: кнопка «i» та діалог деталей точки */
  .inf { cursor:pointer; text-align:center; color:var(--blue); width:30px; }
  .inf:hover { color:var(--navy); }
  .inf svg { vertical-align:-2px; }
  dialog { border:none; border-radius:14px; padding:0; max-width:420px; width:92%;
           box-shadow:0 12px 48px rgba(0,20,50,.35); margin:auto; background:#fff;
           color:var(--text); font-family:'Open Sans',system-ui,sans-serif; }
  dialog::backdrop { background:rgba(0,20,50,.45); }
  .sd-head { background:var(--navy); color:#fff; padding:10px 14px; font-size:13.5px; font-weight:700;
             display:flex; justify-content:space-between; align-items:center; }
  .sd-head span:last-child { cursor:pointer; }
  .sd-body { padding:12px 14px; font-size:12.5px; }
  .sd-body table { border-collapse:collapse; }
  .sd-body td { border:none; padding:4px 0; }
  .sd-body td:first-child { color:var(--muted); width:44%; }
  .sd-body td:last-child { color:var(--text); }
  .sd-pf { border-top:1px solid var(--cream-200); margin-top:8px; padding-top:8px;
           display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1><svg width="30" height="21" viewBox="0 0 289 205" fill="none"><path d="M142.601 0.0234656C64.6979 0.996655 1.07459 63.4296 0.0138122 139.957C-0.207669 155.848 2.24028 171.156 6.93801 185.468C10.7498 197.1 21.7539 205 34.2035 205H205.98C215.573 205 224.386 199.813 228.897 191.501C234.352 181.472 236.357 171.522 235.996 163.725C235.553 153.673 231.543 145.979 225.015 142.624C212.857 136.373 204.767 140.873 189.054 150.788C174.599 159.913 156.613 171.259 130.979 168.878C106.43 166.611 87.1841 151.83 78.185 128.359C68.1018 102.025 73.5222 70.677 91.3806 52.1063C99.9717 43.1529 118.448 30.1007 149.444 36.3635C154.584 37.4054 157.708 42.5461 156.146 47.4693L154.643 52.1864C153.302 56.3997 148.942 58.9644 144.536 58.1171C129.196 55.1289 116.618 58.2889 107.852 67.3911C95.9268 79.8021 92.3598 102.14 99.3889 120.504C102.816 129.435 111.745 144.731 133.112 146.723C150.947 148.383 163.502 140.449 176.791 132.057C192.889 121.901 211.155 110.372 235.506 122.886C249.401 130.03 257.841 144.548 258.645 162.752C259.088 172.896 257.037 184.941 251.465 197.043C249.751 200.764 252.561 204.989 256.722 204.989H269.16C272.156 204.989 274.872 203.271 276.107 200.592C284.396 182.708 289 162.844 289 141.914C289 62.9258 223.278 -1.00697 142.601 0.0120139V0.0234656ZM179.95 75.7032C178.796 74.398 177.642 73.276 176.453 72.2684C173.177 69.4748 172.513 64.7234 174.751 61.0596L177.14 57.1439C179.996 52.4612 186.408 51.4079 190.709 54.8541C193.169 56.8234 195.372 58.9644 197.878 62.1015C201.387 66.4751 200.011 72.8982 195.01 75.5086L190.965 77.6153C187.282 79.5387 182.689 78.7831 179.95 75.6918V75.7032Z" fill="#fff"/></svg>TMS</h1>
  <nav class="tabs">
    <a href="/index.html">Планування</a>
    <a class="on">План / Факт</a>
    <a href="/fuel.html">Транспортні листи <span id="fuelNotice" style="display:none;background:var(--red);color:#fff;border-radius:999px;padding:0 5px;font-size:10px"></span></a>
  </nav>
  <input type="date" id="d">
  <span class="trk" id="trk" onclick="toggleTrack()"><span class="sw"><i></i></span>Показувати трек</span>
  <span id="status" style="font-size:12px;margin-left:auto"></span>
  <button class="icon-btn" id="bellBtn" onclick="toggleIssues()" title="Повідомлення від водіїв" aria-label="Повідомлення від водіїв" style="position:relative">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
    </svg>
    <span id="bellCnt" style="display:none;position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:1px 5px;min-width:16px"></span>
  </button>
  <button class="icon-btn" id="gearBtn" onclick="location.href='/index.html?settings=1'" title="Налаштування" aria-label="Відкрити налаштування">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>

  const b=document.getElementById('fuelNotice'); if(b&&j.count){b.textContent=j.count;b.style.display='inline'}
}).catch(()=>{});
</script>
<div id="layout">
  <div id="map"></div>
  <div id="panel"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
$('d').value = new Date().toISOString().slice(0,10);
const map = L.map('map').setView([50.45, 30.52], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OSM'}).addTo(map);
let layers = L.layerGroup().addTo(map);
let trackLayer = L.layerGroup().addTo(map);
let tracks = {};                                    // route_id -> polyline
let markers = {};                                   // v41: route-order -> маркер точки
let focusRoute = null;                              // підсвічений рейс
let showTrack = localStorage.getItem('tmsTrack') === '1';
const hm = ts => ts ? new Date(ts).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}) : '';
const toMin = s => { if(!s) return null; const [h,m]=String(s).split(':'); return +h*60 + +m; };
const tsMin = ts => { if(!ts) return null; const t=new Date(ts); return t.getHours()*60+t.getMinutes(); };

const TRUCK = `<svg viewBox="0 0 50 40" width="17" height="14" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="4" width="26" height="22" rx="2"/><rect x="6" y="9" width="18" height="12" rx="1"/><path d="M6 9l9 6 9-6"/><path d="M28 12h8c5 0 8 4 8 8v6H28z"/><path d="M2 26h44"/><circle cx="13" cy="32" r="4.5"/><circle cx="37" cy="32" r="4.5"/></svg>`;

function delta(eta, arrive_ts) {
  const p = toMin(eta), f = tsMin(arrive_ts);
  if (p==null || f==null) return '';
  const d = f - p;
  return `<span class="${d>5?'late':'early'}">${d>0?'+':''}${d} хв</span>`;
}

function toggleTrack() {
  showTrack = !showTrack;
  localStorage.setItem('tmsTrack', showTrack ? '1' : '0');
  $('trk').classList.toggle('on', showTrack);
  if (showTrack) loadTracks(); else { trackLayer.clearLayers(); tracks = {}; }
}

function focus(rid) {                               // клік по шапці рейсу
  focusRoute = focusRoute === rid ? null : rid;
  Object.entries(tracks).forEach(([id, pl]) =>
    pl.setStyle({opacity: (focusRoute===null || +id===focusRoute) ? .85 : .5}));
}

function focusStop(rid, oid) {                      // v41: dblclick по рядку таблиці
  const m = markers[rid + '-' + oid];
  if (!m) return;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 15));
  m.openTooltip();
  const el = m.getElement() && m.getElement().querySelector('.npt');   // v51
  if (el) {
    el.style.transition = 'transform .2s';
    el.style.transform = 'scale(1.5)';
    clearTimeout(m._pulse);
    m._pulse = setTimeout(() => el.style.transform = '', 1800);
  }
  if (focusRoute !== rid) focus(rid);
}

async function loadTracks() {
  if (!showTrack) return;
  const r = await fetch(`/api/facts/tracks?plan_date=${$('d').value}`);
  const data = await r.json();
  trackLayer.clearLayers(); tracks = {};
  data.forEach(t => {
    const segments = (t.segments||[]).filter(s => s.length > 1);
    const latlngs = segments.length ? segments : (t.points.length > 1 ? [t.points] : []);
    if (!latlngs.length) return;
    tracks[t.route_id] = L.polyline(latlngs, {color:t.color,
      weight:t.matched?3:2.5, dashArray:t.matched?null:'6 5',
      opacity:(focusRoute===null||t.route_id===focusRoute)?.8:.5})
      .addTo(trackLayer);
  });
}

let _routesData = [];                               // v51: для діалогу деталей точки

function stopInfo(rid, oid) {
  const rt = _routesData.find(r => r.route_id === rid);
  const s = rt && rt.stops.find(x => x.order_id === oid);
  if (!s) return;
  const row = (k, v) => v ? `<tr><td>${k}</td><td>${v}</td></tr>` : '';
  const b = (v, c) => `<b style="${c?'color:'+c:''}">${v}</b>`;
  const kind = s.kind === 'pickup' ? 'забір' : 'доставка';
  const dm = (p, f) => {
    if (!p || !f) return '';
    const d = tsMin(f) - toMin(p);
    return ` <span class="${d>5?'late':'early'}">${d>0?'+':''}${d} хв</span>`;
  };
  $('sdTitle').textContent = `Точка ${s.seq} · ${s.client}`;
  $('sdBody').innerHTML = `<table style="width:100%">
    ${row('Документ', s.doc_number ? `${b(s.doc_number)} · ${kind}` : kind)}
    ${row('Адреса', s.address)}
    ${row('Уточнення', s.address_extra)}
    ${row('Конт. особа', [s.contact_person, s.phone].filter(Boolean).join(' · '))}
    ${row('Вікно роботи', s.tw_from ? b(`${s.tw_from} – ${s.tw_to||''}`) : 'не задано')}
    ${row('Перерва', s.break_from ? `${s.break_from} – ${s.break_to||''}` : '')}
    ${row('Вага / Об\u2019єм', `${(+s.weight_kg).toFixed(1)} кг · ${(+s.volume_m3).toFixed(3)} м³`)}
    ${row('Місць', s.seats)}
    ${row('Розвантаження', s.service_min ? s.service_min + ' хв' : '')}
    </table>
    <div class="sd-pf">
      <span>План ${b((s.eta||'—') + '–' + (s.etd||'—'), 'var(--navy)')}</span>
      <span>Факт ${s.fail_ts
        ? `<b class="failtag">✗ ${s.fail_reason||'відмова'}</b> · ${hm(s.fail_ts)}`
        : b((hm(s.arrive_ts)||'—') + '–' + (hm(s.depart_ts)||'—'), 'var(--green)') + dm(s.eta, s.arrive_ts)}</span>
    </div>`;
  $('stopDlg').showModal();
}

async function load() {
  const r = await fetch(`/api/facts?plan_date=${$('d').value}`);
  const routes = await r.json();
  _routesData = routes;                             // v51
  layers.clearLayers(); markers = {};
  const pts = [];
  // v56: один маркер авто на транспортний засіб — колір рейсу, в якому воно зараз
  const vehBest = {};
  routes.forEach(rt => {
    if (!rt.last_gps) return;
    const cur = vehBest[rt.vehicle];
    const act = rt.start_ts && !rt.finish_ts, curAct = cur && cur.start_ts && !cur.finish_ts;
    if (!cur || (act && !curAct) ||
        (!!act === !!curAct && new Date(rt.last_gps.ts) > new Date(cur.last_gps.ts)))
      vehBest[rt.vehicle] = rt;
  });
  $('panel').innerHTML = routes.map(rt => {
    const done = rt.stops.filter(s=>s.depart_ts).length;
    const fails = rt.stops.filter(s=>s.fail_ts).length;
    rt.stops.forEach(s => {
      if (s.lat==null) return;
      pts.push([s.lat, s.lon]);
      const fill = s.fail_ts ? '#E8890C'
                 : s.depart_ts ? '#2E8B57' : s.arrive_ts ? '#B8860B' : '#bbb';
      markers[rt.route_id + '-' + s.order_id] =        // v51: маркер з номером у плані
        L.marker([s.lat, s.lon], {icon: L.divIcon({className:'',
          html:`<div class="npt" style="background:${fill};border-color:${rt.color}">${s.seq}</div>`,
          iconSize:[24,24], iconAnchor:[12,12]})})
       .bindTooltip(`<b>${s.seq}. ${s.client}</b><br>${s.address||''}<br>` +
         (s.fail_ts ? `<b style="color:#B8860B">✗ ${s.fail_reason||'відмова'}</b> · ${hm(s.fail_ts)}`
                    : `План ${s.eta||'—'} · Факт ${hm(s.arrive_ts)||'—'}`))
       .addTo(layers);
    });
    if (rt.last_gps && vehBest[rt.vehicle] === rt) {   // v56: єдиний маркер авто
      pts.push([rt.last_gps.lat, rt.last_gps.lon]);
      L.marker([rt.last_gps.lat, rt.last_gps.lon], {icon: L.divIcon({className:'',
        html:`<div style="display:flex;align-items:center;gap:5px;cursor:pointer">
          <div style="width:32px;height:32px;border-radius:50%;background:${rt.color};box-shadow:0 0 0 2.5px #fff,0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;flex:none">${TRUCK}</div>
          <div style="background:${rt.color};color:#fff;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 1.5px #fff;text-shadow:0 1px 2px rgba(0,0,0,.35)">${rt.vehicle}</div></div>`,
        iconSize:null, iconAnchor:[16,16]})})
       .bindTooltip(`${rt.driver||''} · ${hm(rt.last_gps.ts)}`)
       .on('click', ()=>focus(rt.route_id))
       .addTo(layers);
    }
    return `<div class="route-card" style="--rc:${rt.color}">
      <div class="route-head" onclick="focus(${rt.route_id})" title="Клік — підсвітити трек">
        <span><i class="rdot" style="background:${rt.color}"></i>${rt.vehicle} · ${rt.driver||'—'}</span>
        <span>${done}/${rt.stops.length} точок${fails ? ' · '+fails+' відмов' : ''} · GPS ${rt.last_gps?hm(rt.last_gps.ts):'—'}</span>
      </div>
      ${(()=>{ // v59: звідки старт і де фініш
        const lbl=(k,a)=> (k||'depot')==='depot'?'склад':k==='home'?'дім':(a||'інша адреса');
        const s=lbl(rt.start_kind,rt.start_address), f=lbl(rt.finish_kind,rt.finish_address);
        return `<div style="padding:6px 12px;font-size:12px;color:#3c4653;border-bottom:1px solid var(--c2,#EFEEEC)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Старт: <b>${s}</b> → Фініш: <b>${f}</b></div>`;})()}
      ${rt.start_ts ? `<div style="background:var(--cream-50);padding:7px 12px;font-size:12px;color:#3c4653;display:flex;gap:14px;flex-wrap:wrap">
        <span>Виїзд <b>${hm(rt.start_ts)}</b></span>
        <span>Повернення <b>${rt.finish_ts?hm(rt.finish_ts):'—'}</b></span>
        ${rt.work_min!=null ? (()=>{
            const f=`${Math.floor(rt.work_min/60)} год ${String(rt.work_min%60).padStart(2,'0')} хв`;
            const pm=toMin(rt.plan_return)!=null&&toMin(rt.plan_depart)!=null ? toMin(rt.plan_return)-toMin(rt.plan_depart) : null;
            const d=pm!=null ? rt.work_min-pm : null;
            return `<span>Час <b>${f}</b>${pm!=null?` / план ${Math.floor(pm/60)}:${String(pm%60).padStart(2,'0')}`:''}${d!=null?` <span class="${d>15?'late':'early'}">${d>0?'+':''}${d} хв</span>`:''}</span>`;})() : ''}
        ${rt.gps_km!=null ? (()=>{
            if (!rt.gps_complete) {
              const note=rt.gps_issue==='route_open'?'Рейс триває':'Неповний GPS';
              return `<span>Шлях <b>${rt.gps_km} км</b> <span class="gps-note">· ${note}</span></span>`;
            }
            const d=rt.plan_km ? +(rt.gps_km-rt.plan_km).toFixed(1) : null;
            return `<span>Шлях <b>${rt.gps_km} км</b>${rt.plan_km?` / план ${rt.plan_km.toFixed(1)}`:''}${d!=null?` <span class="${d>10?'late':'early'}">${d>0?'+':''}${d} км</span>`:''}</span>`;})() : ''}
      </div>` : ''}
      <table><tr><th>#</th><th>Ф№</th><th>Клієнт</th><th>План</th><th>Прибув</th><th>Поїхав</th><th>Δ / Статус</th><th></th></tr>
      ${(()=>{                                     // v38: фактична послідовність
        const vis = rt.stops.filter(s=>s.arrive_ts||s.fail_ts)
          .slice().sort((a,b)=>new Date(a.arrive_ts||a.fail_ts)-new Date(b.arrive_ts||b.fail_ts));
        const fno = {}; vis.forEach((s,i)=>fno[s.order_id]=i+1);
        return rt.stops.map((s,i)=>{
          const f = fno[s.order_id];
          const fcell = f==null ? '<td style="color:#999">—</td>'
            : f===i+1 ? `<td class="fok">${f}</td>`
            : `<td class="fmv">${f} ${f>i+1?'↓':'↑'}</td>`;
          return `<tr class="${s.fail_ts?'failrow':s.depart_ts?'done':''}" style="cursor:pointer" title="Подвійний клік — показати точку на карті" ondblclick="focusStop(${rt.route_id},${s.order_id})">
        <td>${s.seq}</td>${fcell}<td>${s.client}</td><td>${s.eta||'—'}</td>
        <td>${hm(s.arrive_ts)||'—'}</td><td>${hm(s.depart_ts)||'—'}</td>
        <td>${s.fail_ts ? '<span class="failtag">✗ '+(s.fail_reason||'відмова')+'</span>' : delta(s.eta, s.arrive_ts)}</td>
        <td class="inf" title="Деталі точки" onclick="event.stopPropagation();stopInfo(${rt.route_id},${s.order_id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg></td></tr>`;
        }).join('');
      })()}
      </table></div>`;
  }).join('') || '<div style="padding:30px;color:#666">Немає активного проекту на цю дату.<br><small>Познач проект «У роботу» на головній сторінці — тут і у водіїв зʼявляться рейси.</small></div>';
  if (pts.length && !window._fitted) { map.fitBounds(pts, {padding:[30,30]}); window._fitted = true; }
  loadTracks();
  $('status').textContent = 'Оновлено ' + new Date().toLocaleTimeString('uk-UA');
}
$('d').addEventListener('change', () => { window._fitted = false; focusRoute = null; load(); });
if (showTrack) $('trk').classList.add('on');
setInterval(load, 30000);
load();
</script>
<dialog id="stopDlg">
  <div class="sd-head"><span id="sdTitle"></span>
    <span onclick="document.getElementById('stopDlg').close()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span></div>
  <div class="sd-body" id="sdBody"></div>
</dialog>
<div id="issuesPanel" style="display:none;position:fixed;top:54px;right:52px;z-index:80;width:340px;max-height:70vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25)">
  <div style="padding:9px 13px;border-bottom:1px solid #eee;font-size:12px;font-weight:700;color:var(--navy)">Повідомлення від водіїв</div>
  <div id="issuesList"></div>
</div>
<script>
let _issues = [];
async function pollIssues() {
  try {
    const r = await fetch('/api/issues');
    if (!r.ok) return;
    _issues = await r.json();
  } catch(e) { return; }
  const count = $('bellCnt');
  count.textContent = _issues.length;
  count.style.display = _issues.length ? 'inline-block' : 'none';
  if ($('issuesPanel').style.display !== 'none') renderIssues();
}
function renderIssues() {
  $('issuesList').innerHTML = _issues.length ? _issues.map(i => `
    <div style="padding:10px 13px;border-bottom:1px solid #f0f0f0;font-size:12px">
      <div><b>${i.type_name}</b> · ${i.client||'—'}</div>
      <div style="color:#5F5E5A;margin:2px 0">${i.driver_name||'Водій'}: ${i.note ? '«'+i.note+'»' : 'без уточнення'}</div>
      <div style="color:#888;display:flex;justify-content:space-between;align-items:center">
        <span>${hm(i.created_at)}${i.doc_number?' · зам. №'+i.doc_number:''}</span>
        <button onclick="ackIssue(${i.id})" style="background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:6px;padding:4px 8px;font-weight:700;cursor:pointer">Прийняв</button>
      </div>
    </div>`).join('')
    : '<div style="padding:18px;font-size:12px;color:#888">Нових повідомлень немає</div>';
}
function toggleIssues() {
  const panel = $('issuesPanel');
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if (show) renderIssues();
}
async function ackIssue(id) {
  try { await fetch(`/api/issues/${id}/ack`, {method:'POST'}); } catch(e) {}
  _issues = _issues.filter(i => i.id !== id);
  renderIssues(); pollIssues();
}
document.addEventListener('click', e => {
  const panel = $('issuesPanel');
  if (panel.style.display !== 'none' && !panel.contains(e.target) && !e.target.closest('#bellBtn'))
    panel.style.display = 'none';
});
setInterval(pollIssues, 30000);
pollIssues();
</script>
</body>
</html>
