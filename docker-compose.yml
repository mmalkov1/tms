services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tms}
      POSTGRES_DB: tms
    volumes:
      - tms_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/ukraine-latest.osrm
    volumes:
      - ./osrm:/data
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://tms:${DB_PASSWORD:-tms}@db:5432/tms
      OSRM_URL: http://osrm:5000
      VISICOM_API_KEY: ${VISICOM_API_KEY:-}
      TMS_1C_LOGIN: ${TMS_1C_LOGIN:-1c}
      TMS_1C_PASSWORD: ${TMS_1C_PASSWORD:-kultukr-1c}
      APK_UPLOAD_KEY: ${APK_UPLOAD_KEY:-}
      # v88: нічне автооновлення дорожніх коефіцієнтів.
      TRAFFIC_PLANNING_WINDOW_DAYS: ${TRAFFIC_PLANNING_WINDOW_DAYS:-30}
      TRAFFIC_PLANNING_MIN_SAMPLES: ${TRAFFIC_PLANNING_MIN_SAMPLES:-20}
      # v54: транспортний лист бачить тільки пілотний водій
      FUEL_PILOT_DRIVER_CODE_1C: ${FUEL_PILOT_DRIVER_CODE_1C:-000000653}
    volumes:
      - tms_apk:/app/apk
    depends_on: [db, osrm]
    restart: unless-stopped
    networks:
      - default
      - n8n_default

volumes:
  tms_pgdata:
  tms_apk:

networks:
  n8n_default:
    external: true
