<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Транспортні листи · TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#00356B;--blue:#285E96;--red:#E82A2C;--cream:#F3F1EF;--c2:#EFEEEC;--c3:#E2DFDA;--text:#1D2B3A;--muted:#77736D;--green:#2E8B57;--amber:#B8860B}*{box-sizing:border-box}body{margin:0;font-family:'Open Sans',system-ui,sans-serif;background:var(--cream);color:var(--text)}header{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:15px;margin:0;font-weight:800}.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:11px;padding:3px}.tabs a{padding:6px 13px;color:#e8edf4;text-decoration:none;border-radius:8px;font-size:13px;font-weight:600}.tabs a.on{background:#fff;color:var(--navy)}header input,header select{padding:7px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:12px}header option{color:#111}.btn{border:0;border-radius:9px;padding:8px 13px;background:var(--navy);color:#fff;font:700 12px 'Open Sans';cursor:pointer}.btn.red{background:var(--red)}.btn.light{background:#fff;color:var(--navy);border:1px solid var(--c3)}main{padding:14px}.setup{background:#fff;border-radius:13px;padding:14px;box-shadow:0 2px 12px rgba(0,53,107,.08);margin-bottom:12px}.setup h2{font-size:14px;color:var(--navy);margin:0 0 9px}.setup-row{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;color:var(--navy);font-weight:700}.field input,.field select,.field textarea{border:1.5px solid var(--c3);border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;background:#fff}.field textarea{min-height:65px}.note{font-size:11px;color:var(--muted);margin-top:8px}.tablebox{background:#fff;border-radius:13px;overflow:auto;box-shadow:0 2px 12px rgba(0,53,107,.08)}table{width:100%;border-collapse:collapse;font-size:11.5px;white-space:nowrap}th{background:var(--c2);color:var(--navy);padding:8px;text-align:left;position:sticky;top:0}td{padding:8px;border-bottom:1px solid var(--c2)}tr.revision td{background:#fff0f0}tr:hover td{background:#f8f7f6}.status{font-size:10px;font-weight:800;border-radius:999px;padding:3px 8px;background:#e9eff7;color:var(--blue)}.status.approved{background:#e1f5ee;color:#087355}.status.revision{background:#fdebec;color:var(--red)}.status.submitted{background:#fff3d9;color:#855f00}.actions{display:flex;gap:5px}.empty{text-align:center;padding:40px;color:var(--muted)}dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);box-shadow:0 15px 50px rgba(0,20,50,.35)}dialog::backdrop{background:rgba(0,20,50,.5)}.dh{background:var(--navy);color:#fff;padding:12px 15px;font-weight:800;display:flex;justify-content:space-between}.db{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.history{margin-top:12px;padding-top:10px;border-top:1px solid var(--c2);max-height:160px;overflow:auto;font-size:10.5px}.hist{padding:6px 0;border-bottom:1px solid var(--c2)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none}
</style></head><body>
<header><h1>TMS</h1><nav class="tabs"><a href="/index.html">Планування</a><a href="/facts.html">План / Факт</a><a class="on">Транспортні листи</a></nav><input type="date" id="from"><input type="date" id="to"><select id="drv" multiple title="Водії"></select><button class="btn light" onclick="load()">Оновити</button><button class="btn red" onclick="exportXlsx()">Excel</button><span id="stat" style="margin-left:auto;font-size:11px"></span></header>
<main><section class="setup" id="setup"><h2>Пілот · налаштування автомобіля</h2><div id="setupBody" class="note">Завантаження…</div></section><section class="tablebox"><table><thead><tr><th>Дата</th><th>Автомобіль</th><th>Водій</th><th>Початок</th><th>Кінець</th><th>Пробіг</th><th>Заправлено</th><th>Норма</th><th>Витрата</th><th>Залишок поч.</th><th>Залишок кін.</th><th>Статус</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="13" class="empty">Завантаження…</td></tr></tbody></table></section></main>
<dialog id="dlg"><div class="dh"><span>Транспортний лист</span><span onclick="dlg.close()" style="cursor:pointer">×</span></div><div class="db" id="dlgBody"></div></dialog><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),statusName={draft:'Чернетка',submitted:'Очікує підтвердження',approved:'Підтверджено',revision:'Повторна перевірка'};let meta=null,data=[],active=null;const iso=d=>d.toISOString().slice(0,10),n=(v,d=1)=>v==null?'—':Number(v).toLocaleString('uk-UA',{minimumFractionDigits:d,maximumFractionDigits:d});
const today=new Date();$('to').value=iso(today);$('from').value=iso(new Date(today.getFullYear(),today.getMonth(),1));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
async function api(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Помилка');return j}
async function loadMeta(){meta=await api('/api/transport-sheets/meta');const m=meta.drivers[0];$('drv').innerHTML=meta.drivers.map(x=>`<option value="${x.driver_id}" selected>${x.name}</option>`).join('');if(!m){$('setupBody').textContent='Водія з кодом '+meta.pilot_code+' не знайдено';return}$('setupBody').innerHTML=`<div class="setup-row"><div><b style="color:var(--navy)">${m.vehicle_name||'Автомобіль не закріплено'}</b><div class="note">${m.name} · код 1С ${m.code_1c}</div></div>${m.vehicle_id?`<div class="field"><label>Норма, л/100 км</label><input id="rate" type="number" step="0.001" value="${m.rate_l_per_100??''}"></div><div class="field"><label>Початковий залишок, л</label><input id="balance" type="number" step="0.001" value="${m.initial_balance_l??''}"></div><div class="field"><label>Дата залишку</label><input id="balanceDate" type="date" value="${m.initial_balance_date||$('from').value}"></div><button class="btn" onclick="saveSettings(${m.vehicle_id})">Зберегти</button>`:''}</div><div class="note">Ці значення потрібні один раз. Далі залишок переноситься з попереднього підтвердженого дня.</div>`}
async function saveSettings(id){try{await api('/api/transport-sheets/settings/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rate_l_per_100:$('rate').value,initial_balance_l:$('balance').value,initial_balance_date:$('balanceDate').value})});toast('Налаштування збережено');await loadMeta();await load()}catch(e){toast(e.message)}}
function selected(){return [...$('drv').selectedOptions].map(o=>o.value).join(',')}
async function load(){try{data=await api(`/api/transport-sheets?date_from=${$('from').value}&date_to=${$('to').value}&driver_ids=${selected()}`);$('stat').textContent=`${data.length} листів`;render()}catch(e){toast(e.message)}}
function render(){if(!data.length){$('rows').innerHTML='<tr><td colspan="13" class="empty">За вибраний період листів немає. Відкрийте кабінет Шарипової, щоб створити перший.</td></tr>';return}$('rows').innerHTML=data.map(x=>{const km=x.odometer_start!=null&&x.odometer_end!=null?x.odometer_end-x.odometer_start:null;return `<tr class="${x.status}"><td>${x.work_date}</td><td>${x.vehicle_name}</td><td>${x.driver_name}</td><td>${n(x.odometer_start)}</td><td>${n(x.odometer_end)}</td><td><b>${n(km)}</b></td><td>${n(x.refueled_l,2)}</td><td>${n(x.rate_l_per_100,2)}</td><td>${n(x.fuel_used_l,2)}</td><td>${n(x.opening_balance_l,2)}</td><td><b>${n(x.closing_balance_l,2)}</b></td><td><span class="status ${x.status}">${statusName[x.status]||x.status}</span></td><td><div class="actions"><button class="btn light" onclick="openSheet(${x.id})">Відкрити</button>${x.status!=='approved'?`<button class="btn" onclick="approve(${x.id})">Підтвердити</button>`:''}</div></td></tr>`}).join('')}
async function openSheet(id){active=await api('/api/transport-sheets/'+id);const changes=active.changes||[];$('dlgBody').innerHTML=`<div class="grid"><div class="field"><label>Одометр початок</label><input id="edStart" value="${active.odometer_start??''}"></div><div class="field"><label>Одометр кінець</label><input id="edEnd" value="${active.odometer_end??''}"></div><div class="field"><label>Залишок на початок, л</label><input id="edOpen" value="${active.opening_balance_l??''}"></div><div class="field"><label>Заправлено, л</label><input disabled value="${active.refueled_l??0}"></div></div><div class="field" style="margin-top:10px"><label>Причина зміни</label><textarea id="edReason" placeholder="Обов'язково при редагуванні"></textarea></div><div style="display:flex;gap:8px"><button class="btn light" onclick="dlg.close()">Закрити</button><button class="btn" onclick="saveEdit()">Зберегти зміни</button>${active.status!=='approved'?`<button class="btn red" onclick="approve(${id})">Підтвердити</button>`:''}</div>${active.revision_reason?`<div class="note" style="color:var(--red)"><b>Причина водія:</b> ${active.revision_reason}</div>`:''}<div class="history">${changes.length?changes.map(c=>`<div class="hist"><b>${c.actor_name||c.actor_role}</b> · ${c.field_name}: ${c.old_value||'—'} → ${c.new_value||'—'}<br>${c.reason||''}</div>`).join(''):'Змін ще не було.'}</div>`;$('dlg').showModal()}
async function saveEdit(){try{await api('/api/transport-sheets/'+active.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({odometer_start:$('edStart').value||null,odometer_end:$('edEnd').value||null,opening_balance_l:$('edOpen').value||null,reason:$('edReason').value})});$('dlg').close();toast('Зміни збережено');load()}catch(e){toast(e.message)}}
async function approve(id){try{await api(`/api/transport-sheets/${id}/approve`,{method:'POST'});$('dlg').close();toast('Лист підтверджено');load()}catch(e){toast(e.message)}}
function exportXlsx(){const ids=selected();location.href=`/api/transport-sheets/export.xlsx?date_from=${$('from').value}&date_to=${$('to').value}&driver_ids=${ids}&approved_only=true`}
(async()=>{await loadMeta();await load()})();
</script></body></html>
