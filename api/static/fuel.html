<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Транспортні листи · TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#00356B;--blue:#285E96;--red:#E82A2C;--cream:#F3F1EF;--c2:#EFEEEC;--c3:#E2DFDA;--text:#1D2B3A;--muted:#77736D;--green:#2E8B57;--amber:#B8860B}
*{box-sizing:border-box}body{margin:0;font-family:'Open Sans',system-ui,sans-serif;background:var(--cream);color:var(--text)}
header{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:800}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:11px;padding:3px}
.tabs a{padding:6px 13px;color:#e8edf4;text-decoration:none;border-radius:8px;font-size:13px;font-weight:600}.tabs a.on{background:#fff;color:var(--navy)}
header input,header select{padding:7px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:12px}header option{color:#111}
.btn{border:0;border-radius:9px;padding:8px 13px;background:var(--navy);color:#fff;font:700 12px 'Open Sans';cursor:pointer}
.btn.red{background:var(--red)}.btn.light{background:#fff;color:var(--navy);border:1px solid var(--c3)}.btn.line{background:#fff;color:var(--navy);border:2px solid var(--navy)}
main{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1.35fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border-radius:13px;padding:14px 16px;box-shadow:0 2px 12px rgba(0,53,107,.08)}
.card h2{font-size:13.5px;color:var(--navy);margin:0;display:flex;align-items:center;gap:8px}
.tag{font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px}
.tag.perm{background:#e9eff7;color:var(--blue)}.tag.live{background:#e1f5ee;color:#087355}
.vh{font-size:16px;font-weight:800;color:var(--navy);margin-top:9px}
.vh small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.frow{display:flex;gap:10px;margin-top:11px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--navy);font-weight:700}
.field input,.field select,.field textarea{border:1.5px solid var(--c3);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;background:#fff}
.field textarea{min-height:60px}
.saved{font-size:11.5px;color:var(--green);font-weight:700;margin-top:8px;min-height:15px}
.balnum{display:flex;align-items:baseline;gap:7px;margin-top:8px}
.balnum b{font-size:31px;font-weight:800;color:var(--navy)}
.balnum span{font-size:13px;color:var(--muted);font-weight:600}
.chain{margin-top:8px;font-size:12px;color:#4d5866;line-height:1.55}
.chain b{color:var(--navy)}
.hist{margin-top:9px;border-top:1px solid var(--c2);max-height:130px;overflow:auto}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:6px 2px;border-bottom:1px solid var(--c2)}
.hrow .why{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .v{font-weight:800;color:var(--navy);white-space:nowrap}
.tablebox{background:#fff;border-radius:13px;overflow:auto;box-shadow:0 2px 12px rgba(0,53,107,.08)}
table{width:100%;border-collapse:collapse;font-size:11.5px;white-space:nowrap}
th{background:var(--c2);color:var(--navy);padding:8px;text-align:left;position:sticky;top:0}
td{padding:8px;border-bottom:1px solid var(--c2)}
tr.revision td{background:#fff0f0}tr:hover td{background:#f8f7f6}
tr.gap td{background:#FFF7E6;color:#854F0B;font-size:11px;border-bottom:1px solid #EF9F27}
.flow{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.flow svg{color:var(--muted);flex:none}
.status{font-size:10px;font-weight:800;border-radius:999px;padding:3px 8px;background:#e9eff7;color:var(--blue)}
.status.approved{background:#e1f5ee;color:#087355}.status.revision{background:#fdebec;color:var(--red)}.status.submitted{background:#fff3d9;color:#855f00}
.actions{display:flex;gap:5px}
.reopen-btn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border:1.5px solid var(--red);border-radius:9px;background:transparent;color:var(--red);cursor:pointer}
.reopen-btn:hover{background:#fff0f0}.reopen-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(232,42,44,.18)}
.reopen-btn svg{width:15px;height:15px}
.locked-note{margin-top:10px;padding:9px 11px;border-radius:9px;background:#fff3d9;color:#855f00;font-size:11.5px;line-height:1.45}
.empty{text-align:center;padding:40px;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(460px,94vw);box-shadow:0 15px 50px rgba(0,20,50,.35)}
dialog::backdrop{background:rgba(0,20,50,.5)}
.dh{background:var(--navy);color:#fff;padding:12px 15px;font-weight:800;display:flex;justify-content:space-between}
.db{padding:15px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.history{margin-top:12px;padding-top:10px;border-top:1px solid var(--c2);max-height:160px;overflow:auto;font-size:10.5px}
.history .h1{padding:6px 0;border-bottom:1px solid var(--c2)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:50}
/* v56: дропдаун водіїв у шапці */
.ddwrap{position:relative}
.ddbtn{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;border:1.5px solid var(--c3);background:#fff;color:var(--navy);font:700 13px 'Open Sans';cursor:pointer;max-width:230px}
.ddbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbtn:hover{border-color:var(--navy)}
.ddpop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;color:var(--text);border-radius:11px;box-shadow:0 10px 34px rgba(0,20,50,.28);padding:8px;min-width:220px;max-height:280px;overflow:auto}
.ddpop.open{display:block}
.ddpop label{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.ddpop label:hover{background:var(--c2)}
.ddpop input{accent-color:var(--navy);width:15px;height:15px}
/* v56: рядки заправок у діалозі */
.refrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--c2);font-size:12px}
.refrow .rt{color:var(--muted);width:92px;flex:none}
.refrow input{border:1.5px solid var(--c3);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;width:90px}
.refrow .del{border:1.5px solid var(--c3);background:#fff;color:var(--red);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.refrow .del:hover{border-color:var(--red)}
</style>
<link rel="stylesheet" href="/shell.css"></head><body>
<header><h1>TMS</h1><nav class="tabs"><a href="/index.html">Планування</a><a href="/facts.html">План / Факт</a><a class="on">Транспортні листи</a></nav>
<span id="stat" style="margin-left:auto;font-size:11px"></span></header>
<div class="toolbar">
  <span class="tlabel">Період</span>
  <input type="date" id="from"><input type="date" id="to">
  <div class="sep"></div>
  <span class="tlabel">Водій</span>
  <div class="ddwrap" id="ddwrap">
    <button class="ddbtn" id="ddbtn" onclick="toggleDd(event)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="ddlabel">Водій</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="ddpop" id="ddpop"></div>
  </div>
  <div class="sep"></div>
  <button class="btn light" onclick="load()">Оновити</button><button class="btn red" onclick="exportXlsx()">Excel</button>
</div>
<main>
<div class="grid2">
  <section class="card" id="carCard">
    <h2>Автомобіль <span class="tag perm">постійні налаштування</span></h2>
    <div id="carBody" style="font-size:12px;color:var(--muted);margin-top:8px">Завантаження…</div>
  </section>
  <section class="card" id="balCard">
    <h2>Паливний баланс <span class="tag live">ланцюжок</span></h2>
    <div id="balBody" style="font-size:12px;color:var(--muted);margin-top:8px">Завантаження…</div>
  </section>
</div>
<section class="tablebox"><table><thead><tr><th>Дата</th><th>Автомобіль</th><th>Водій</th><th>Одометр</th><th>Пробіг</th><th title="GPS за день: рейси (як у План/Факт) + плечі до/від складу. Інформаційно">GPS за день</th><th>Заправлено</th><th>Норма</th><th>Витрата</th><th>Залишок поч → кін</th><th>Статус</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="12" class="empty">Завантаження…</td></tr></tbody></table></section>
</main>
<dialog id="dlg"><div class="dh"><span id="dlgTitle">Транспортний лист</span><span onclick="dlg.close()" style="cursor:pointer">×</span></div><div class="db" id="dlgBody"></div></dialog>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),ARROW='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const statusName={draft:'Чернетка',submitted:'Очікує підтвердження',approved:'Підтверджено',revision:'Повторна перевірка'};
let meta=null,data=[],active=null,vehId=null;
const iso=d=>d.toISOString().slice(0,10),n=(v,d=1)=>v==null?'—':Number(v).toLocaleString('uk-UA',{minimumFractionDigits:d,maximumFractionDigits:d});
const dt=s=>s?new Date(s).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const today=new Date();$('to').value=iso(today);$('from').value=iso(new Date(today.getFullYear(),today.getMonth(),1));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
async function api(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Помилка');return j}

async function loadMeta(){
  meta=await api('/api/transport-sheets/meta');
  // v69: рівно один водій; вибір пам'ятається між сесіями
  const saved=localStorage.getItem('tmsFuelDriver');
  const known=meta.drivers.some(x=>String(x.driver_id)===saved);
  const pick=known?saved:(meta.drivers[0]?String(meta.drivers[0].driver_id):null);
  $('ddpop').innerHTML=meta.drivers.map(x=>`<label><input type="radio" name="fuelDrv" value="${x.driver_id}"${String(x.driver_id)===pick?' checked':''} onchange="ddChanged()">${x.name}</label>`).join('')
    ||'<div style="padding:8px;font-size:12px;color:var(--muted)">Немає водіїв із закріпленим авто</div>';
  ddChanged(false);
}
// v57: картки показують авто ОДНОГО вибраного водія
function renderCards(){
  const id=selected();
  const m=id?meta.drivers.find(x=>String(x.driver_id)===id):null;
  if(!m){
    vehId=null;
    const hint=meta.drivers.length?'Оберіть водія у панелі зверху.':'Немає водіїв із закріпленим авто';
    $('carBody').innerHTML=`<div style="font-size:12.5px;color:var(--muted);padding:6px 0">${hint}</div>`;
    $('balBody').innerHTML=`<div style="font-size:12.5px;color:var(--muted);padding:6px 0">${meta.drivers.length?'Оберіть водія, щоб побачити баланс.':'—'}</div>`;
    return;
  }
  vehId=m.vehicle_id;
  $('carBody').innerHTML=`<div class="vh">${m.vehicle_name||'Автомобіль не закріплено'}<small>${m.name} · код 1С ${m.code_1c||'—'}</small></div>
    ${vehId?`<div class="frow"><div class="field"><label>Норма, л/100 км</label><input id="rate" type="number" step="0.001" style="width:120px" value="${m.rate_l_per_100??''}"></div>
    <button class="btn" onclick="saveRate()">Зберегти</button></div>
    <div class="saved" id="rateSaved"></div>
    <div style="font-size:11px;color:var(--muted)">Норма — постійне налаштування. Зміна впливає на нові розрахунки; підтверджені листи не перераховуються.</div>`:''}`;
  if(vehId)loadBalance();
}
async function loadBalance(){
  const b=await api('/api/transport-sheets/balance/'+vehId);
  const cur=b.current,sp=b.start_point;
  const startLine=sp&&sp.initial_balance_l!=null&&sp.initial_balance_date
    ?`Ланцюжок ведеться з <b>${sp.initial_balance_date} (${n(sp.initial_balance_l,1)} л)</b>`
    :`<b style="color:var(--amber)">Немає стартової точки</b> — додайте коригування залишку на дату`;
  const adj=(b.adjustments||[]).map(a=>`<div class="hrow"><span>${a.adjust_date} · коригування</span><span class="why" title="${a.reason}">${a.reason}</span><span class="v">${n(a.balance_l,1)} л</span></div>`).join('');
  $('balBody').innerHTML=`
    <div class="balnum"><b>${cur?n(cur.closing_balance_l,1):'—'}</b><span>л · залишок на кінець ${cur?cur.work_date:'—'}${cur&&cur.status!=='approved'?' (не підтверджено)':''}</span></div>
    <div class="chain">${startLine} · кожен день: залишок поч. = залишок кін. попереднього підтвердженого дня</div>
    <div class="hist">${adj||'<div class="hrow"><span class="why">Коригувань ще не було</span></div>'}</div>
    <div style="margin-top:10px"><button class="btn line" onclick="openAdjust()">Скоригувати залишок на дату</button></div>`;
}
async function saveRate(){
  try{const j=await api('/api/transport-sheets/settings/'+vehId,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({rate_l_per_100:$('rate').value})});
    $('rateSaved').textContent='Збережено '+dt(j.updated_at)+' · діє для нових розрахунків';
    await load();await loadBalance()}catch(e){toast(e.message)}
}
function openAdjust(){
  $('dlgTitle').textContent='Коригування залишку';
  $('dlgBody').innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Задає залишок пального на ранок вказаної дати. Ланцюжок перерахується вперед; підтверджені листи не змінюються.</div>
    <div class="dgrid"><div class="field"><label>Дата</label><input id="adjDate" type="date" value="${iso(new Date())}"></div>
    <div class="field"><label>Залишок на ранок, л</label><input id="adjVal" type="number" step="0.001"></div></div>
    <div class="field" style="margin-top:10px"><label>Причина</label><textarea id="adjReason" placeholder="Напр.: звірка по чеку АЗС, інвентаризація"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn light" onclick="dlg.close()">Скасувати</button><button class="btn" onclick="saveAdjust()">Застосувати</button></div>`;
  $('dlg').showModal();
}
async function saveAdjust(){
  try{await api('/api/transport-sheets/adjustments',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({vehicle_id:vehId,adjust_date:$('adjDate').value,balance_l:$('adjVal').value,reason:$('adjReason').value})});
    dlg.close();toast('Коригування застосовано, ланцюжок перераховано');await load();await loadBalance()}catch(e){toast(e.message)}
}

function selected(){const o=document.querySelector('#ddpop input:checked');return o?o.value:''}
function ddChanged(reload=true){
  const sel=document.querySelector('#ddpop input:checked');
  $('ddlabel').textContent=sel?sel.parentElement.textContent.trim():'Немає водіїв';
  if(sel)localStorage.setItem('tmsFuelDriver',sel.value);   // v69: пам'ять вибору
  $('ddpop').classList.remove('open');
  if(meta)renderCards();                 // v57: картки слідують за вибором
  if(reload)load();
}
function toggleDd(e){e.stopPropagation();$('ddpop').classList.toggle('open')}
document.addEventListener('click',e=>{if(!$('ddwrap').contains(e.target))$('ddpop').classList.remove('open')});
async function load(){try{
  data=await api(`/api/transport-sheets?date_from=${$('from').value}&date_to=${$('to').value}&driver_ids=${selected()}`);
  $('stat').textContent=`${data.length} листів`;render()}catch(e){toast(e.message)}}

// v69: GPS за добу + позначка розбіжності з одометром понад 15%
function gpsCell(x,km){
  if(x.gps_km==null) return '<span style="color:var(--muted)">—</span>';
  let mark='';
  if(km!=null&&km>0){
    const d=Math.round((x.gps_km-km)/km*100);
    if(Math.abs(d)>25) mark=` <span style="font-size:10.5px;font-weight:800;color:var(--amber)" title="Розбіжність із одометром">${d>0?'+':''}${d}%</span>`;
  }
  return `<b>${n(x.gps_km,1)}</b>${mark}`;
}
function render(){
  if(!data.length){$('rows').innerHTML='<tr><td colspan="12" class="empty">За вибраний період листів немає. Відкрийте кабінет водія, щоб створити перший.</td></tr>';return}
  const asc=[...data].sort((a,b)=>a.work_date<b.work_date?-1:1);
  let html='',prev=null;
  for(const x of asc){
    if(prev){
      const d1=new Date(prev.work_date),d2=new Date(x.work_date),gap=Math.round((d2-d1)/86400000)-1;
      if(gap>0)html+=`<tr class="gap"><td colspan="12">${gap===1?'1 день без листа':gap+' дн. без листів'} — залишок ${n(prev.closing_balance_l,1)} л переноситься без розриву</td></tr>`;
    }
    const km=x.odometer_start!=null&&x.odometer_end!=null?x.odometer_end-x.odometer_start:null;
    // v71: початок дня має дорівнювати кінцю попереднього — інакше помилка вводу
    let odoWarn='';
    if(prev&&prev.odometer_end!=null&&x.odometer_start!=null&&
       Number(prev.odometer_end)!==Number(x.odometer_start)){
      const diff=Number(x.odometer_start)-Number(prev.odometer_end);
      odoWarn=` <span style="color:var(--amber);font-weight:800;cursor:help" title="Розрив ланцюжка: попередній день завершився на ${n(prev.odometer_end)} км. Різниця ${diff>0?'+':''}${n(diff)} км — схоже на помилку вводу"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg> розрив ${diff>0?'+':''}${n(diff,0)}</span>`;
    }
    html+=`<tr class="${x.status}">
      <td><b>${x.work_date}</b></td><td>${x.vehicle_name}</td><td>${x.driver_name}</td>
      <td style="color:#4d5866">${n(x.odometer_start)}${odoWarn} → <b style="color:var(--text)">${n(x.odometer_end)}</b></td>
      <td><b>${n(km)}</b></td><td>${gpsCell(x,km)}</td><td>${n(x.refueled_l,2)}</td><td>${n(x.rate_l_per_100,2)}</td><td>${n(x.fuel_used_l,2)}</td>
      <td><span class="flow">${n(x.opening_balance_l,1)} ${ARROW} <b>${n(x.closing_balance_l,1)}</b></span>${x.opening_balance_l==null?' <span style="color:var(--amber);font-weight:800">немає ланцюжка</span>':''}</td>
      <td><span class="status ${x.status}">${statusName[x.status]||x.status}</span></td>
      <td><div class="actions"><button class="btn light" onclick="openSheet(${x.id})">Відкрити</button>
      ${x.status!=='approved'?`<button class="btn" onclick="approve(${x.id})">Підтвердити</button>`
        :reopenButton(x.id)}</div></td></tr>`;
    prev=x;
  }
  $('rows').innerHTML=html;
}

async function openSheet(id){
  active=await api('/api/transport-sheets/'+id);const changes=active.changes||[],locked=active.status==='approved';
  $('dlgTitle').textContent='Транспортний лист · '+active.work_date;
  const refs=(active.refuels||[]);
  const refRows=refs.length?refs.map(x=>`<div class="refrow" data-rid="${x.id}">
      <span class="rt">${dt(x.refuel_at)}</span>
      <input inputmode="decimal" value="${x.liters}" data-old="${x.liters}" ${locked?'disabled':''}> л
      ${locked?'':`<button class="del" title="Видалити заправку" onclick="delRefuel(${x.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>`}
    </div>`).join(''):'<div style="font-size:12px;color:var(--muted);padding:4px 0">Заправок не було</div>';
  $('dlgBody').innerHTML=`
    <div class="dgrid">
      <div class="field"><label>Одометр початок</label><input id="edStart" value="${active.odometer_start??''}" ${locked?'disabled':''}></div>
      <div class="field"><label>Одометр кінець</label><input id="edEnd" value="${active.odometer_end??''}" ${locked?'disabled':''}></div>
      <div class="field"><label>Залишок на початок, л</label><input disabled value="${active.opening_balance_l??'—'}" title="Керується ланцюжком і коригуваннями"></div>
      <div class="field"><label>Заправлено разом, л</label><input disabled value="${active.refueled_l??0}"></div>
    </div>
    <div style="font-size:11px;color:var(--navy);font-weight:700;margin-top:10px">Заправки</div>
    <div id="refList">${refRows}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">Залишок редагується лише через «Скоригувати залишок на дату» — так зберігається ланцюжок.</div>
    ${locked?'<div class="locked-note">Лист підтверджено. Щоб змінити одометр або заправки, спочатку скасуйте підтвердження.</div>'
      :'<div class="field" style="margin-top:10px"><label>Причина зміни</label><textarea id="edReason" placeholder="Обов&#39;язково при редагуванні показників або заправок"></textarea></div>'}
    <div style="display:flex;gap:8px"><button class="btn light" onclick="dlg.close()">Закрити</button>
      ${locked?reopenButton(id):`<button class="btn" onclick="saveEdit()">Зберегти зміни</button>
      <button class="btn red" onclick="approve(${id})">Підтвердити</button>`}</div>
    ${active.revision_reason?`<div style="font-size:11px;color:var(--red);margin-top:8px"><b>Причина водія:</b> ${active.revision_reason}</div>`:''}
    <div class="history">${changes.length?changes.map(c=>`<div class="h1"><b>${c.actor_name||c.actor_role}</b> · ${c.field_name}: ${c.old_value||'—'} → ${c.new_value||'—'}<br>${c.reason||''}</div>`).join(''):'Змін ще не було.'}</div>`;
  $('dlg').showModal();
}
function reopenButton(id){
  return `<button class="reopen-btn" onclick="confirmReopen(${id})" title="Скасувати підтвердження" aria-label="Скасувати підтвердження">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>`;
}
function confirmReopen(id){
  const x=data.find(s=>s.id===id)||active;
  $('dlgTitle').textContent='Скасувати підтвердження';
  $('dlgBody').innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px">${x?.work_date||''} · ${x?.vehicle_name||x?.vehicle||''}</div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.55">Показники одометра та заправки не видаляються. Лист повернеться на перевірку та одразу відкриється для редагування.</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn light" onclick="dlg.close()">Залишити</button>
      <button class="btn red" onclick="doReopen(${id})">Скасувати підтвердження</button></div>`;
  $('dlg').showModal();
}
async function doReopen(id){
  try{
    await api(`/api/transport-sheets/${id}/reopen`,{method:'POST'});
    dlg.close();await load();if(vehId)await loadBalance();
    toast('Підтвердження скасовано');await openSheet(id);
  }catch(e){toast(e.message)}
}
async function delRefuel(rid){
  const reason=($('edReason').value||'').trim();
  if(!reason){toast('Спершу вкажіть причину зміни внизу діалогу');return}
  if(!confirm('Видалити цю заправку?'))return;
  try{await api(`/api/transport-sheets/${active.id}/refuels/${rid}?reason=${encodeURIComponent(reason)}`,{method:'DELETE'});
    toast('Заправку видалено');await openSheet(active.id);load();loadBalance()}catch(e){toast(e.message)}
}
async function saveEdit(){
  const reason=($('edReason').value||'').trim();
  // v56: спершу — змінені заправки
  const edited=[...document.querySelectorAll('#refList .refrow')].filter(r=>{
    const i=r.querySelector('input');return i.value.trim()!==''&&i.value.replace(',','.')!==String(i.dataset.old)});
  if(edited.length&&!reason){toast('Вкажіть причину зміни');return}
  try{
    for(const r of edited){
      await api(`/api/transport-sheets/${active.id}/refuels/${r.dataset.rid}`,{method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({liters:r.querySelector('input').value,reason})});
    }
    const os=$('edStart').value.trim(),oe=$('edEnd').value.trim();
    const odoChanged=os!==String(active.odometer_start??'')||oe!==String(active.odometer_end??'');
    if(odoChanged){
      if(!reason){toast('Вкажіть причину зміни одометра');return}
      await api('/api/transport-sheets/'+active.id,{method:'PATCH',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({odometer_start:os||null,odometer_end:oe||null,reason})});
    }
    if(!edited.length&&!odoChanged){dlg.close();return}
    dlg.close();toast('Зміни збережено');load();loadBalance()}catch(e){toast(e.message)}
}
async function approve(id){
  try{await api(`/api/transport-sheets/${id}/approve`,{method:'POST'});dlg.close();toast('Лист підтверджено');load();loadBalance()}catch(e){toast(e.message)}
}
function exportXlsx(){location.href=`/api/transport-sheets/export.xlsx?date_from=${$('from').value}&date_to=${$('to').value}&driver_ids=${selected()}&approved_only=true`}
(async()=>{await loadMeta();await load()})();
</script><script src="/shell.js"></script>
</body></html>
