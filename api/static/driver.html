<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Рейс · TMS Культтовари</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root { --navy:#00356B; --red:#E82A2C; --cream:#EFEEEC; --green:#2E8B57; --amber:#B8860B; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:Manrope,system-ui,sans-serif; background:var(--cream); padding-bottom:40px; }
  header { background:var(--navy); color:#fff; padding:12px 14px; position:sticky; top:0; z-index:5; }
  header .veh { font-size:17px; font-weight:800; }
  header .sub { font-size:13px; opacity:.85; margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:700; }
  .badge.late { background:var(--red); } .badge.ok { background:var(--green); }
  .gps { font-size:11px; opacity:.85; display:inline-flex; align-items:center; gap:5px; }
  .gps .bars { display:inline-flex; align-items:flex-end; gap:2px; height:13px; }
  .gps .bars i { width:3px; background:rgba(255,255,255,.35); border-radius:1px; }
  .gps .bars i.on { background:#fff; }
  .gps .bars i:nth-child(1){height:4px} .gps .bars i:nth-child(2){height:7px}
  .gps .bars i:nth-child(3){height:10px} .gps .bars i:nth-child(4){height:13px}
  .stop { background:#fff; margin:10px 10px 0; border-radius:10px; padding:12px;
          border-left:6px solid var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stop.done { opacity:.55; border-left-color:var(--green); }
  .stop.current { border-left-color:var(--red); box-shadow:0 2px 8px rgba(232,42,44,.25); }
  .num { display:inline-flex; min-width:26px; height:26px; align-items:center; justify-content:center;
         background:var(--navy); color:#fff; border-radius:50%; font-weight:800; font-size:13px; margin-right:8px; }
  .kind { display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px;
          margin-left:6px; vertical-align:middle; }
  .kind.del { background:#E8F1FF; color:var(--navy); }
  .kind.pick { background:#FFF3D6; color:var(--amber); }
  .client { font-size:16px; font-weight:800; color:var(--navy); }
  .addr { font-size:14px; margin:4px 0 6px; }
  .cmt { font-size:13.5px; font-weight:600; color:#7a4a00; background:#FFF3D6;
         border-left:3px solid var(--amber); border-radius:6px; padding:7px 10px; margin:6px 0; }
  .meta { font-size:13px; color:#555; display:flex; gap:12px; flex-wrap:wrap; }
  .meta b { color:#222; }
  .fact { font-size:13px; color:var(--green); font-weight:700; margin-top:4px; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .b-nav { flex:0 0 54px; min-height:48px; display:flex; align-items:center; justify-content:center;
           border:none; border-radius:9px; background:var(--navy); cursor:pointer; padding:0; }
  .b-nav svg { width:26px; height:26px; }
  .b-nav.open { box-shadow:0 0 0 3px rgba(0,53,107,.25); }
  .b-call { flex:1 1 auto; min-width:0; min-height:48px; display:flex; align-items:center;
            justify-content:center; gap:7px; border-radius:9px; font-size:15px; font-weight:800;
            text-decoration:none; }
  .b-call.on  { background:var(--green); color:#fff; }
  .b-call.off { background:#EEE; color:#999; pointer-events:none; }
  .b-map { flex:1; min-height:48px; display:flex; align-items:center; justify-content:center;
           border-radius:9px; font-size:14px; font-weight:800; text-decoration:none; }
  .b-map.gmap { background:#1A73E8; color:#fff; } .b-map.waze { background:#33CCFF; color:#062B45; }
  button { flex:1; min-height:54px; border:none; border-radius:9px; font:inherit;
           font-size:16px; font-weight:800; color:#fff; cursor:pointer; }
  button:disabled { opacity:.4; }
  .b-arr { background:var(--red); }
  .b-dep { background:var(--green); }
  .b-fail { flex:0 0 54px; background:#fff; color:var(--red); border:2px solid var(--red);
            font-size:20px; }
  .stop.failed { opacity:.75; border-left-color:var(--amber); }
  .person { font-size:13px; color:var(--navy); margin-top:6px; display:flex;
            align-items:center; gap:6px; }
  .fail-line { font-size:13px; color:var(--amber); font-weight:800; margin-top:6px;
               display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .b-unfail { flex:0 0 auto; min-height:30px; padding:0 12px; font-size:12px;
              background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:7px; }
  #failDlg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
             align-items:flex-end; justify-content:center; z-index:20; }
  #failDlg.open { display:flex; }
  #failBox { background:#fff; border-radius:14px 14px 0 0; padding:16px; width:100%;
             max-width:480px; max-height:80vh; overflow:auto; }
  #failBox h3 { font-size:15px; font-weight:800; color:var(--navy); margin-bottom:2px; }
  #failBox .sub { font-size:13px; color:#666; margin-bottom:12px; }
  .r-btn { display:block; width:100%; min-height:50px; border:none; border-radius:9px;
           background:var(--cream); color:var(--navy); font:inherit; font-size:15px;
           font-weight:800; margin-bottom:8px; }
  .r-btn.sel { background:var(--navy); color:#fff; }
  #failTxt { width:100%; box-sizing:border-box; min-height:44px; border:1.5px solid #ccc;
             border-radius:9px; padding:10px 12px; font:inherit; font-size:14px;
             margin-bottom:10px; display:none; }
  #failActions { display:flex; gap:8px; }
  #failActions .cancel { background:#ccc; color:#333; }
  #failActions .confirm { background:var(--red); }
  .empty { text-align:center; padding:50px 20px; color:#666; font-size:15px; }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#222; color:#fff;
           padding:10px 18px; border-radius:8px; font-size:14px; display:none; z-index:10; }
  .daytabs { display:flex; gap:6px; margin-top:9px; }
  .dt { flex:1; padding:6px; border:none; border-radius:6px; font:inherit; font-size:13px;
        background:rgba(255,255,255,.15); color:#cfd9e6; }
  .dt.on { background:#fff; color:var(--navy); font-weight:700; }
  .cnt { background:var(--red); color:#fff; border-radius:8px; padding:0 6px; font-size:11px; font-weight:800; }
  .preview-note { background:#FFF7E6; border:1px solid #EF9F27; border-radius:8px;
                  padding:8px 11px; font-size:12px; color:#854F0B; margin:10px 10px 0; }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><svg width="34" height="24" viewBox="0 0 289 205" fill="none" style="flex:none"><path d="M142.601 0.0234656C64.6979 0.996655 1.07459 63.4296 0.0138122 139.957C-0.207669 155.848 2.24028 171.156 6.93801 185.468C10.7498 197.1 21.7539 205 34.2035 205H205.98C215.573 205 224.386 199.813 228.897 191.501C234.352 181.472 236.357 171.522 235.996 163.725C235.553 153.673 231.543 145.979 225.015 142.624C212.857 136.373 204.767 140.873 189.054 150.788C174.599 159.913 156.613 171.259 130.979 168.878C106.43 166.611 87.1841 151.83 78.185 128.359C68.1018 102.025 73.5222 70.677 91.3806 52.1063C99.9717 43.1529 118.448 30.1007 149.444 36.3635C154.584 37.4054 157.708 42.5461 156.146 47.4693L154.643 52.1864C153.302 56.3997 148.942 58.9644 144.536 58.1171C129.196 55.1289 116.618 58.2889 107.852 67.3911C95.9268 79.8021 92.3598 102.14 99.3889 120.504C102.816 129.435 111.745 144.731 133.112 146.723C150.947 148.383 163.502 140.449 176.791 132.057C192.889 121.901 211.155 110.372 235.506 122.886C249.401 130.03 257.841 144.548 258.645 162.752C259.088 172.896 257.037 184.941 251.465 197.043C249.751 200.764 252.561 204.989 256.722 204.989H269.16C272.156 204.989 274.872 203.271 276.107 200.592C284.396 182.708 289 162.844 289 141.914C289 62.9258 223.278 -1.00697 142.601 0.0120139V0.0234656ZM179.95 75.7032C178.796 74.398 177.642 73.276 176.453 72.2684C173.177 69.4748 172.513 64.7234 174.751 61.0596L177.14 57.1439C179.996 52.4612 186.408 51.4079 190.709 54.8541C193.169 56.8234 195.372 58.9644 197.878 62.1015C201.387 66.4751 200.011 72.8982 195.01 75.5086L190.965 77.6153C187.282 79.5387 182.689 78.7831 179.95 75.6918V75.7032Z" fill="#fff"/></svg>
    <div style="min-width:0">
      <div class="veh" id="hVeh">Завантаження…</div>
      <div class="sub"><span id="hDriver"></span><span id="hDate"></span>
        <span id="hDelay"></span><span class="gps" id="hGps">
          <span class="bars"><i></i><i></i><i></i><i></i></span><span id="hGpsTxt">GPS —</span></span></div>
    </div>
  </div>
  <div class="daytabs">
    <button class="dt on" id="tabToday" onclick="setMode('today')">Сьогодні</button>
    <button class="dt" id="tabNext" onclick="setMode('next')">Завтра <span class="cnt" id="nextCnt" style="display:none"></span></button>
  </div>
</header>
<div id="list"></div>
<div id="failDlg">
  <div id="failBox">
    <h3>Чому не виконано?</h3>
    <div class="sub" id="failSub"></div>
    <div id="failReasons"></div>
    <input id="failTxt" placeholder="Опиши причину">
    <div id="failActions">
      <button class="cancel" onclick="closeFail()">Скасувати</button>
      <button class="confirm" onclick="doFail()">Підтвердити</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('token');
const NATIVE = /TMSKultApp/.test(navigator.userAgent);   // v26: сторінка всередині APK
const $ = id => document.getElementById(id);

const NAV_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>';
const NAV_PHONE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

const PERSON_ICO = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

// --- відмова: модалка вибору причини ---
let failCtx = null;   // {ids, kind, reasonId}

function openFail(gi, ids, kind) {
  failCtx = { ids, kind, reasonId: null };
  const grp = document.querySelectorAll('.stop')[gi];
  $('failSub').textContent = (grp?.querySelector('.client')?.textContent || '') +
    ' · ' + (kind === 'pickup' ? 'забір' : 'доставка');
  const reasons = (trip.fail_reasons && trip.fail_reasons[kind]) || [];
  $('failReasons').innerHTML = reasons.map(r =>
    `<button class="r-btn" data-id="${r.id}" data-name="${r.name}"
       onclick="pickReason(this)">${r.name}</button>`).join('');
  $('failTxt').style.display = 'none';
  $('failTxt').value = '';
  $('failDlg').classList.add('open');
}

function pickReason(btn) {
  document.querySelectorAll('.r-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  failCtx.reasonId = +btn.dataset.id;
  const isOther = btn.dataset.name.trim().toLowerCase().startsWith('інше');
  $('failTxt').style.display = isOther ? 'block' : 'none';
  if (isOther) $('failTxt').focus();
}

function closeFail() { $('failDlg').classList.remove('open'); failCtx = null; }

async function doFail() {
  if (!failCtx || !failCtx.reasonId) { toast('Обери причину'); return; }
  const txt = $('failTxt').style.display !== 'none' ? $('failTxt').value.trim() : '';
  if ($('failTxt').style.display !== 'none' && !txt) { toast('Опиши причину'); return; }
  const pos = lastPos ? {lat:lastPos.lat, lon:lastPos.lon} : {};
  for (const id of failCtx.ids.split(',')) {
    try {
      const r = await fetch(`/api/driver/${TOKEN}/stops/${id}/fail`, {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({reason_id: failCtx.reasonId, reason_text: txt || null, ...pos})});
      if (!r.ok) { toast('Помилка — спробуй ще раз'); return; }
    } catch(e) { toast('Немає зв’язку — спробуй ще раз'); return; }
  }
  closeFail();
  toast('Відмову зафіксовано');
  await load();
}

async function unfail(ids) {
  if (!confirm('Повернути точку в роботу?')) return;
  for (const id of ids.split(',')) {
    try {
      const r = await fetch(`/api/driver/${TOKEN}/stops/${id}/unfail`, {method:'POST'});
      if (!r.ok) {
        const j = await r.json().catch(()=>({}));
        toast(j.detail || 'Помилка'); return;
      }
    } catch(e) { toast('Немає зв’язку — спробуй ще раз'); return; }
  }
  toast('Точку повернуто в роботу');
  await load();
}

// показать/скрыть навигаторы: замещают кнопку «Подзвонити»
function toggleNav(gi) {
  const act = $('act' + gi);
  const open = act.classList.toggle('open-nav');
  act.querySelector('.b-nav').classList.toggle('open', open);
  $('call' + gi).style.display = open ? 'none' : '';
  act.querySelectorAll('.b-map').forEach(a => a.style.display = open ? '' : 'none');
}
let trip = null;

function toast(m) { const t=$('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 2500); }
const hm = ts => ts ? new Date(ts).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}) : '';
const toMin = s => { if(!s) return null; const [h,m]=s.split(':'); return +h*60 + +m; };

// подряд идущие точки одного клиент+адрес = одна остановка
function groupStops(stops) {
  const g = [];
  for (const s of stops) {
    const last = g[g.length-1];
    if (last && last.client===s.client && last.address===s.address) {
      last.items.push(s);
      if (!last.phone && s.phone) last.phone = s.phone;
      if (!last.contact_person && s.contact_person) last.contact_person = s.contact_person;
    } else g.push({client:s.client, address:s.address, address_extra:s.address_extra,
                 kind:s.kind, lat:s.lat, lon:s.lon, phone:s.phone,
                 contact_person:s.contact_person, items:[s]});
  }
  return g;
}

let MODE = 'today', nextTrip = null;

function setMode(m) {
  MODE = m;
  $('tabToday').classList.toggle('on', m==='today');
  $('tabNext').classList.toggle('on', m==='next');
  if (m==='today') render(); else renderNext();
}

async function loadNext() {                        // v28: рейс на наступний день
  try {
    const r = await fetch(`/api/driver/${TOKEN}/next-trip`);
    nextTrip = (await r.json()).trip;
  } catch(e) { return; }
  const c = $('nextCnt');
  if (nextTrip) {
    $('tabNext').childNodes[0].textContent = 'Завтра · ' +
      nextTrip.date.split('-').reverse().slice(0,2).join('.') + ' ';
    c.textContent = nextTrip.stops.length; c.style.display='inline-block';
  } else { $('tabNext').childNodes[0].textContent = 'Завтра '; c.style.display='none'; }
  if (MODE==='next') renderNext();
}

function renderNext() {
  if (!nextTrip) { $('list').innerHTML =
    '<div class="empty">Рейс на наступний день ще не сформовано</div>'; return; }
  const groups = groupStops(nextTrip.stops.map(s=>({...s, items:undefined})));
  $('list').innerHTML =
    `<div class="preview-note">Перегляд рейсу на ${nextTrip.date.split('-').reverse().join('.')}` +
    ` · ${nextTrip.vehicle}${nextTrip.plate?' · '+nextTrip.plate:''}` +
    `${nextTrip.depart?' · виїзд ~'+nextTrip.depart:''}. Кнопки з'являться у день рейсу.</div>` +
    groups.map((g,gi)=>{
      const w = g.items.reduce((a,s)=>a+(s.weight_kg||0),0);
      const kindBadge = g.kind==='pickup' ? '<span class="kind pick">ЗАБІР</span>'
                                          : '<span class="kind del">ДОСТАВКА</span>';
      return `<div class="stop">
        <div><span class="num">${gi+1}</span><span class="client">${g.client}</span>${kindBadge}</div>
        <div class="addr">${g.address||''}</div>
        ${g.address_extra ? `<div class="cmt">💬 ${g.address_extra}</div>` : ''}
        <div class="meta"><span>План: <b>${g.items[0].eta||'—'}</b></span>
          <span><b>${w.toFixed(0)}</b> кг · ${g.items.length} завд.</span></div>
      </div>`;
    }).join('');
}

async function load() {
  if (!TOKEN) { $('list').innerHTML='<div class="empty">Немає токена в посиланні</div>'; return; }
  let r;
  try { r = await fetch(`/api/driver/${TOKEN}/trip`); } catch(e) { toast('Немає зв’язку'); return; }
  if (r.status===401) { $('list').innerHTML='<div class="empty">Токен недійсний — звернись до логіста</div>'; return; }
  trip = await r.json();
  if (MODE==='today') render();
  loadNext();
}

function render() {
  $('hDriver').textContent = trip.driver;
  $('hDate').textContent = trip.date.split('-').reverse().join('.');
  if (!trip.route) {
    if (trip.not_released) {
      $('hVeh').textContent = 'Рейс ще не підтверджено';
      $('list').innerHTML = '<div class="empty">Логіст ще не активував план на цю дату.<br>Сторінка оновиться автоматично.</div>';
    } else {
      $('hVeh').textContent = 'Рейсу на сьогодні немає';
      $('list').innerHTML = '<div class="empty">План на цю дату ще не сформовано</div>';
    }
    return;
  }
  $('hVeh').textContent = trip.route.vehicle + (trip.route.plate ? ' · '+trip.route.plate : '');

  const groups = groupStops(trip.stops);
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  let currentShown = false, delay = null;

  $('list').innerHTML = groups.map((g, gi) => {
    const arrived  = g.items.every(s => s.arrive_ts);
    const departed = g.items.every(s => s.depart_ts);
    const failed   = g.items.every(s => s.fail_ts);
    const closed   = departed || failed;
    const first = g.items[0], lastIt = g.items[g.items.length-1];
    const isCurrent = !closed && !currentShown;
    if (isCurrent) {
      currentShown = true;
      const eta = toMin(first.eta);
      if (eta != null && !arrived) delay = nowMin - eta;   // + = запізнення
    }
    const w = g.items.reduce((a,s)=>a+s.weight_kg,0);
    const win = first.tw_from ? `${first.tw_from}–${first.tw_to||''}` : 'без вікна';
    const isPickup = g.kind === 'pickup';
    const kindBadge = isPickup ? '<span class="kind pick">ЗАБІР</span>'
                               : '<span class="kind del">ДОСТАВКА</span>';
    const dest = g.lat ? `${g.lat},${g.lon}` : encodeURIComponent(g.address || g.client);
    const gmap = NATIVE
      ? `google.navigation:q=${dest}`
      : `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`;
    const waze = NATIVE
      ? (g.lat ? `waze://?ll=${g.lat},${g.lon}&navigate=yes`
               : `waze://?q=${encodeURIComponent(g.address || g.client)}&navigate=yes`)
      : (g.lat ? `https://waze.com/ul?ll=${g.lat},${g.lon}&navigate=yes`
               : `https://waze.com/ul?q=${encodeURIComponent(g.address || g.client)}&navigate=yes`);
    const phone = (g.phone || '').trim();
    const tel = phone.replace(/[^\d+]/g, '');
    const call = phone
      ? `<a class="b-call on" id="call${gi}" href="tel:${tel}">${NAV_PHONE} Подзвонити</a>`
      : `<span class="b-call off" id="call${gi}">${NAV_PHONE} Подзвонити</span>`;
    const seats = g.items.reduce((a,s)=>a+(s.seats||0),0);
    const ids = g.items.map(s=>s.order_id).join(',');
    return `<div class="stop ${departed?'done':''} ${failed?'failed':''} ${isCurrent?'current':''}">
      <div><span class="num">${gi+1}</span><span class="client">${g.client}</span>${kindBadge}</div>
      <div class="addr">${g.address||''}</div>
      ${g.address_extra ? `<div class="cmt">💬 ${g.address_extra}</div>` : ''}
      <div class="meta"><span>План: <b>${first.eta||'—'}</b></span><span>Вікно: <b>${win}</b></span>
        <span><b>${w.toFixed(0)}</b> кг${seats ? ` · <b>${seats}</b> міс.` : ''} · ${g.items.length} завд.</span></div>
      ${g.contact_person ? `<div class="person">${PERSON_ICO} <b>${g.contact_person}</b></div>` : ''}
      ${arrived && !failed ? `<div class="fact">✓ Прибув ${hm(first.arrive_ts)}${departed ? ' → Поїхав '+hm(lastIt.depart_ts):''}</div>` : ''}
      ${failed ? `<div class="fail-line">✗ Не виконано · ${first.fail_reason||''} · ${hm(first.fail_ts)}${first.arrive_ts ? ' (прибув '+hm(first.arrive_ts)+')' : ''}
        <button class="b-unfail" onclick="unfail('${ids}')">Відмінити</button></div>` : ''}
      ${closed ? '' : `
      <div class="actions" id="act${gi}">
        <button class="b-nav" onclick="toggleNav(${gi})" aria-label="Навігація">${NAV_ARROW}</button>
        ${call}
        <a class="b-map gmap" href="${gmap}" target="_blank" rel="noopener" style="display:none">Google Maps</a>
        <a class="b-map waze" href="${waze}" target="_blank" rel="noopener" style="display:none">Waze</a>
      </div>
      <div class="btns">
        <button class="b-arr" onclick="mark('${ids}','arrive')" ${arrived?'disabled':''}>Прибув</button>
        <button class="b-dep" onclick="mark('${ids}','depart')" ${arrived?'':'disabled'}>Поїхав</button>
        <button class="b-fail" onclick="openFail(${gi},'${ids}','${isPickup?'pickup':'delivery'}')" title="Не виконано">✗</button>
      </div>`}
    </div>`;
  }).join('') || '<div class="empty">На маршруті немає точок</div>';

  const d = $('hDelay');
  if (delay == null) d.innerHTML = '';
  else if (delay > 5) d.innerHTML = `<span class="badge late">−${delay} хв</span>`;
  else d.innerHTML = `<span class="badge ok">за графіком</span>`;
}

async function mark(ids, event) {
  const pos = lastPos ? {lat:lastPos.lat, lon:lastPos.lon} : {};
  for (const id of ids.split(',')) {
    try {
      const r = await fetch(`/api/driver/${TOKEN}/stops/${id}/event`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({event, ...pos})});
      if (!r.ok) { toast('Помилка — спробуй ще раз'); return; }
    } catch(e) { toast('Немає зв’язку — спробуй ще раз'); return; }
  }
  toast(event==='arrive' ? 'Прибуття зафіксовано' : 'Виїзд зафіксовано');
  await load();
}

// --- GPS поки сторінка відкрита (фаза 1; надійний фоновий трек — в APK, фаза 2) ---
let lastPos = null, queue = [];
try { queue = JSON.parse(localStorage.getItem('gpsq')||'[]'); } catch(e) {}

function setGps(bars, txt) {
  const b = document.querySelectorAll('#hGps .bars i');
  b.forEach((el,i)=> el.classList.toggle('on', i < bars));
  $('hGpsTxt').textContent = txt;
}

window.nativeGps = acc => {                 // v26: APK оновлює індикатор сигналу
  const bars = acc<=15?4 : acc<=40?3 : acc<=100?2 : 1;
  setGps(bars, '±' + Math.round(acc) + ' м');
};
if (NATIVE) setGps(0, 'додаток');

if (navigator.geolocation && TOKEN && !NATIVE) {
  navigator.geolocation.watchPosition(p => {
    lastPos = {lat:p.coords.latitude, lon:p.coords.longitude};
    queue.push({ts:p.timestamp, lat:p.coords.latitude, lon:p.coords.longitude,
      speed_kmh: p.coords.speed!=null ? p.coords.speed*3.6 : null,
      accuracy_m: p.coords.accuracy});
    if (queue.length>1000) queue = queue.slice(-1000);
    localStorage.setItem('gpsq', JSON.stringify(queue));
    const acc = p.coords.accuracy;                    // менше метрів = кращий сигнал
    const bars = acc<=15?4 : acc<=40?3 : acc<=100?2 : 1;
    setGps(bars, '±' + Math.round(acc) + ' м');
  }, e => { setGps(0, 'вимкнено'); },
  {enableHighAccuracy:true, maximumAge:10000});
}

setInterval(async () => {          // досилання пачкою кожні 20 с
  if (!queue.length || !TOKEN) return;
  const batch = queue.splice(0, 500);
  try {
    const r = await fetch(`/api/driver/${TOKEN}/position`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({points:batch})});
    if (!r.ok) throw 0;
    localStorage.setItem('gpsq', JSON.stringify(queue));
  } catch(e) { queue = batch.concat(queue); }   // не вийшло — повернути в чергу
}, 20000);

setInterval(load, 60000);          // автооновлення плану
load();
</script>
</body>
</html>
