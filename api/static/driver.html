<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Рейс · TMS Культтовари</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#00356B; --blue:#285E96; --red:#E82A2C; --red-dark:#C92123; --cream:#F3F1EF;
          --cream-50:#F6F4F5; --cream-200:#EFEEEC; --cream-300:#E2DFDA; --cream-400:#D7D4D0;
          --text:#1D2B3A; --muted:#9A948A; --green:#2E8B57; --amber:#B8860B; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Open Sans',system-ui,sans-serif; color:var(--text); background:var(--cream); padding-bottom:40px; }
  header { background:var(--navy); color:#fff; padding:12px 14px; position:sticky; top:0; z-index:5; }
  header .veh { font-size:17px; font-weight:800; }
  header .sub { font-size:13px; opacity:.9; margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.late { background:var(--red); } .badge.ok { background:var(--green); }
  .gps { font-size:11px; opacity:.9; display:inline-flex; align-items:center; gap:5px; }
  .gps .bars { display:inline-flex; align-items:flex-end; gap:2px; height:13px; }
  .gps .bars i { width:3px; background:rgba(255,255,255,.35); border-radius:1px; }
  .gps .bars i.on { background:#fff; }
  .gps .bars i:nth-child(1){height:4px} .gps .bars i:nth-child(2){height:7px}
  .gps .bars i:nth-child(3){height:10px} .gps .bars i:nth-child(4){height:13px}
  .stop { background:#fff; margin:10px 10px 0; border-radius:12px; padding:12px;
          border-left:5px solid var(--navy); box-shadow:0 2px 10px rgba(0,53,107,.08); }
  .stop.done { opacity:.55; border-left-color:var(--green); }
  .stop.current { border-left-color:var(--red); box-shadow:0 3px 12px rgba(232,42,44,.22); }
  .num { display:inline-flex; min-width:26px; height:26px; align-items:center; justify-content:center;
         background:var(--navy); color:#fff; border-radius:50%; font-weight:800; font-size:13px; margin-right:8px; }
  .kind { display:inline-block; font-size:11px; font-weight:800; padding:2px 10px; border-radius:999px;
          margin-left:6px; vertical-align:middle; }
  .kind.del { background:rgba(40,94,150,.12); color:var(--blue); }
  .kind.pick { background:#FFF3D6; color:var(--amber); }
  .client { font-size:16px; font-weight:800; color:var(--navy); }
  .addr { font-size:14px; margin:4px 0 6px; }
  .cmt { font-size:13.5px; font-weight:600; color:#7a4a00; background:#FFF3D6;
         border-left:3px solid var(--amber); border-radius:8px; padding:7px 10px; margin:6px 0; }
  .meta { font-size:13px; color:#4d5866; display:flex; gap:12px; flex-wrap:wrap; }
  .meta b { color:var(--text); }
  .fact { font-size:13px; color:var(--green); font-weight:700; margin-top:4px; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .b-nav { flex:0 0 54px; min-height:48px; display:flex; align-items:center; justify-content:center;
           border:none; border-radius:11px; background:var(--navy); cursor:pointer; padding:0; box-shadow:0 2px 8px rgba(0,53,107,.3); }
  .b-nav svg { width:26px; height:26px; }
  .b-nav.open { box-shadow:0 0 0 3px rgba(0,53,107,.25); }
  .b-call { flex:1 1 auto; min-width:0; min-height:48px; display:flex; align-items:center;
            justify-content:center; gap:7px; border-radius:11px; font-size:15px; font-weight:800;
            text-decoration:none; }
  .b-call.on  { background:var(--green); color:#fff; box-shadow:0 2px 8px rgba(46,139,87,.3); }
  .b-call.off { background:var(--cream-200); color:var(--muted); pointer-events:none; }
  .b-map { flex:1; min-height:48px; display:flex; align-items:center; justify-content:center;
           border-radius:11px; font-size:14px; font-weight:800; text-decoration:none; }
  .b-map.gmap { background:#1A73E8; color:#fff; } .b-map.waze { background:#33CCFF; color:#062B45; }
  button { flex:1; min-height:54px; border:none; border-radius:11px; font:inherit;
           font-size:16px; font-weight:800; color:#fff; cursor:pointer; }
  button:disabled { opacity:.4; }
  .b-arr { background:var(--red); box-shadow:0 2px 8px rgba(232,42,44,.3); }
  .b-dep { background:var(--green); box-shadow:0 2px 8px rgba(46,139,87,.3); }
  .b-fail { flex:0 0 54px; background:#fff; color:var(--red); border:2px solid var(--red);
            font-size:20px; }
  .stop.failed { opacity:.75; border-left-color:var(--amber); }
  .person { font-size:13px; color:var(--navy); margin-top:6px; display:flex;
            align-items:center; gap:6px; }
  .fail-line { font-size:13px; color:var(--amber); font-weight:800; margin-top:6px;
               display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .b-unfail { flex:0 0 auto; min-height:30px; padding:0 12px; font-size:12px;
              background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:8px; }
  #failDlg, #cardDlg { position:fixed; inset:0; background:rgba(0,20,50,.5); display:none;
             align-items:flex-end; justify-content:center; z-index:20; }
  #failDlg.open, #cardDlg.open { display:flex; }
  #failBox, #cardBox { background:#fff; border-radius:16px 16px 0 0; padding:16px; width:100%;
             max-width:480px; max-height:80vh; overflow:auto; }
  #failBox h3, #cardBox h3 { font-size:15px; font-weight:800; color:var(--navy); margin-bottom:2px; }
  #failBox .sub, #cardBox .sub { font-size:13px; color:var(--muted); margin-bottom:12px; }
  .card-row { display:flex; gap:9px; align-items:flex-start; font-size:14px; margin-bottom:9px; }
  .card-row svg { flex:none; margin-top:1px; }
  .b-issue { display:flex; width:100%; min-height:48px; align-items:center; justify-content:center;
             gap:8px; border:2px solid #D85A30; border-radius:11px; background:#fff; color:#993C1D;
             font:inherit; font-size:14px; font-weight:800; margin-top:10px; }
  #issueTxt { width:100%; box-sizing:border-box; min-height:56px; border:1.5px solid var(--cream-300);
              border-radius:11px; padding:10px 12px; font:inherit; font-size:14px; margin-bottom:10px; }
  #issueTxt:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,53,107,.12); }
  .r-btn { display:block; width:100%; min-height:50px; border:none; border-radius:11px;
           background:var(--cream); color:var(--navy); font:inherit; font-size:15px;
           font-weight:800; margin-bottom:8px; }
  .r-btn.sel { background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(0,53,107,.3); }
  #failTxt { width:100%; box-sizing:border-box; min-height:44px; border:1.5px solid var(--cream-300);
             border-radius:11px; padding:10px 12px; font:inherit; font-size:14px;
             margin-bottom:10px; display:none; }
  #failTxt:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,53,107,.12); }
  #failActions { display:flex; gap:8px; }
  #failActions .cancel { background:var(--cream-300); color:var(--text); }
  #failActions .confirm { background:var(--red); box-shadow:0 2px 8px rgba(232,42,44,.3); }
  .empty { text-align:center; padding:50px 20px; color:var(--muted); font-size:15px; }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
           padding:11px 18px; border-radius:11px; font-size:14px; display:none; z-index:10; box-shadow:0 4px 18px rgba(0,20,50,.35); }
  .daytabs { display:flex; gap:4px; margin-top:9px; background:rgba(246,244,245,.12); border-radius:11px; padding:3px; }
  .dt { flex:1; padding:6px; border:none; border-radius:8px; font:inherit; font-size:13px;
        background:transparent; color:#E8EDF4; font-weight:600; }
  .dt.on { background:#fff; color:var(--navy); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .cnt { background:var(--red); color:#fff; border-radius:999px; padding:0 6px; font-size:11px; font-weight:800; }
  .b-route { display:block; width:calc(100% - 20px); margin:10px; padding:14px; border:none;
             border-radius:12px; font:inherit; font-size:15px; font-weight:800; }
  .b-route.go { background:var(--green); color:#fff; box-shadow:0 2px 8px rgba(46,139,87,.3); }
  .b-route.fin { background:#fff; color:var(--navy); border:2px solid var(--navy); }
  .rswitch { display:flex; gap:7px; margin:10px 10px 0; }
  .rsw { flex:1; border:1.5px solid var(--cream-400); border-radius:10px; background:#fff; color:#4d5866;
         font:inherit; font-size:12px; padding:7px 4px; text-align:center; line-height:1.35; }
  .rsw.on { border-color:var(--navy); background:var(--navy); color:#fff; }
  .rsw.fin { border-color:#1D9E75; color:#085041; background:#E1F5EE; }
  .rsw.fin.on { border-color:var(--navy); outline:2px solid var(--navy); }
  .onroute { background:#E1F5EE; border:1px solid #1D9E75; color:#085041; border-radius:10px;
             padding:8px 11px; margin:10px 10px 0; font-size:13px; }
  .routedone { background:#fff; border-radius:10px; padding:10px 12px; margin:10px 10px 0; font-size:13px; box-shadow:0 1px 3px rgba(0,53,107,.08); }
  .preview-note { background:#FFF7E6; border:1px solid #EF9F27; border-radius:10px;
                  padding:8px 11px; font-size:12px; color:#854F0B; margin:10px 10px 0; }
  /* v54: пілотний транспортний лист */
  /* v55: чип ТЛ */
  .tl-chip { display:flex; align-items:center; gap:9px; background:#fff; margin:10px 10px 0;
             border-radius:11px; padding:8px 12px; box-shadow:0 1px 4px rgba(0,53,107,.10);
             font-size:13px; cursor:pointer; }
  .tl-chip.closed { border-left:4px solid var(--green); }
  .tl-chip.warn { border-left:4px solid var(--amber); }
  .tl-chip .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-chip .t b { color:var(--navy); }
  .tl-chip .fuelbtn { flex:none; width:38px; height:38px; display:flex; align-items:center;
             justify-content:center; border:1.5px solid var(--cream-300); border-radius:9px;
             background:#fff; color:var(--navy); padding:0; min-height:0; box-shadow:none; }
  .tl-chip .chev { color:var(--muted); font-size:17px; font-weight:700; }
  .tl-sumrow { display:flex; justify-content:space-between; font-size:13.5px; padding:7px 2px;
               border-bottom:1px solid var(--cream-200); }
  .tl-sumrow b { color:var(--navy); }
  .tl-odo { display:flex; align-items:baseline; justify-content:center; gap:6px;
            border:1.5px solid var(--cream-300); border-radius:12px; padding:12px;
            font-size:26px; font-weight:800; color:var(--navy); margin-bottom:6px; }
  .tl-odo input { border:none; outline:none; font:inherit; color:inherit; width:150px; text-align:center; }
  .tl-odo small { font-size:13px; font-weight:600; color:var(--muted); }
  .tl-hint { font-size:12px; color:var(--muted); text-align:center; margin-bottom:12px; }
  .fuel-card { background:#fff; margin:10px 10px 0; border-radius:13px; padding:13px;
               border-left:5px solid var(--navy); box-shadow:0 2px 10px rgba(0,53,107,.1); }
  .fuel-head { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--navy); }
  .fuel-head b { font-size:15px; } .fuel-status { border-radius:999px; padding:3px 9px; font-size:10px; font-weight:800; background:#E9EFF7; color:var(--blue); }
  .fuel-status.revision { background:#FDEBEC; color:var(--red); } .fuel-status.approved { background:#E1F5EE; color:#087355; }
  .fuel-grid { display:grid; grid-template-columns:1fr auto; gap:8px 12px; margin:12px 0; font-size:12.5px; }
  .fuel-grid span:nth-child(odd) { color:#69737e; } .fuel-grid b { text-align:right; }
  .fuel-actions { display:flex; gap:7px; flex-wrap:wrap; }
  .fuel-actions button { min-height:43px; font-size:13px; padding:0 11px; }
  .fuel-primary { background:var(--navy); } .fuel-secondary { background:#fff; color:var(--navy); border:1.5px solid var(--cream-300); }
  #fuelDlg { position:fixed; inset:0; background:rgba(0,20,50,.5); display:none; align-items:flex-end; justify-content:center; z-index:80; }
  #fuelDlg.open { display:flex; } #fuelBox { background:#fff; border-radius:16px 16px 0 0; padding:16px; width:100%; max-width:480px; max-height:88vh; overflow:auto; }
  #fuelBox h3 { color:var(--navy); font-size:17px; margin-bottom:4px; } #fuelBox .fsub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .fuel-field { margin-bottom:12px; } .fuel-field label { display:block; color:var(--navy); font-size:12px; font-weight:700; margin-bottom:5px; }
  .fuel-field input,.fuel-field select,.fuel-field textarea { width:100%; border:1.5px solid var(--cream-300); border-radius:10px; padding:11px 12px; font:inherit; font-size:15px; }
  .fuel-field textarea { min-height:70px; resize:vertical; } .fuel-field input:focus,.fuel-field select:focus,.fuel-field textarea:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(0,53,107,.12); }
  .fuel-note { background:#FFF7E6; color:#854F0B; border:1px solid #EF9F27; border-radius:10px; padding:9px 11px; font-size:11px; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><svg width="34" height="24" viewBox="0 0 289 205" fill="none" style="flex:none"><path d="M142.601 0.0234656C64.6979 0.996655 1.07459 63.4296 0.0138122 139.957C-0.207669 155.848 2.24028 171.156 6.93801 185.468C10.7498 197.1 21.7539 205 34.2035 205H205.98C215.573 205 224.386 199.813 228.897 191.501C234.352 181.472 236.357 171.522 235.996 163.725C235.553 153.673 231.543 145.979 225.015 142.624C212.857 136.373 204.767 140.873 189.054 150.788C174.599 159.913 156.613 171.259 130.979 168.878C106.43 166.611 87.1841 151.83 78.185 128.359C68.1018 102.025 73.5222 70.677 91.3806 52.1063C99.9717 43.1529 118.448 30.1007 149.444 36.3635C154.584 37.4054 157.708 42.5461 156.146 47.4693L154.643 52.1864C153.302 56.3997 148.942 58.9644 144.536 58.1171C129.196 55.1289 116.618 58.2889 107.852 67.3911C95.9268 79.8021 92.3598 102.14 99.3889 120.504C102.816 129.435 111.745 144.731 133.112 146.723C150.947 148.383 163.502 140.449 176.791 132.057C192.889 121.901 211.155 110.372 235.506 122.886C249.401 130.03 257.841 144.548 258.645 162.752C259.088 172.896 257.037 184.941 251.465 197.043C249.751 200.764 252.561 204.989 256.722 204.989H269.16C272.156 204.989 274.872 203.271 276.107 200.592C284.396 182.708 289 162.844 289 141.914C289 62.9258 223.278 -1.00697 142.601 0.0120139V0.0234656ZM179.95 75.7032C178.796 74.398 177.642 73.276 176.453 72.2684C173.177 69.4748 172.513 64.7234 174.751 61.0596L177.14 57.1439C179.996 52.4612 186.408 51.4079 190.709 54.8541C193.169 56.8234 195.372 58.9644 197.878 62.1015C201.387 66.4751 200.011 72.8982 195.01 75.5086L190.965 77.6153C187.282 79.5387 182.689 78.7831 179.95 75.6918V75.7032Z" fill="#fff"/></svg>
    <div style="min-width:0">
      <div class="veh" id="hVeh">Завантаження…</div>
      <div class="sub"><span id="hDriver"></span><span id="hDate"></span>
        <span id="hDelay"></span><span class="gps" id="hGps">
          <span class="bars"><i></i><i></i><i></i><i></i></span><span id="hGpsTxt">GPS —</span></span></div>
    </div>
  </div>
  <div class="daytabs">
    <button class="dt on" id="tabToday" onclick="setMode('today')">Сьогодні</button>
    <button class="dt" id="tabNext" onclick="setMode('next')">Завтра <span class="cnt" id="nextCnt" style="display:none"></span></button>

</header>
<div id="list"></div>
<div id="ptr" style="height:0;overflow:hidden;text-align:center;font-size:13px;color:#5F5E5A;background:#E7E5E0;line-height:44px;transition:height .15s"></div>
<div id="tmap" style="display:none;position:fixed;inset:0;z-index:70;background:#EFEEEC">
  <div id="tmapCanvas" style="position:absolute;inset:0"></div>
  <button onclick="closeTomorrowMap()" style="position:absolute;top:12px;right:12px;z-index:1000;border:none;border-radius:8px;background:#00356B;color:#fff;font:800 14px 'Open Sans',sans-serif;padding:10px 16px;box-shadow:0 1px 5px rgba(0,0,0,.3)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="vertical-align:-2px"><path d="M5 5l14 14M19 5L5 19"/></svg> Закрити</button>
</div>
<div id="askDlg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;align-items:center;justify-content:center;padding:24px">
  <div style="background:#fff;border-radius:12px;padding:18px;max-width:320px;width:100%">
    <div id="askTxt" style="font-size:15px;font-weight:700;color:#111;margin-bottom:14px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="askDone(false)" style="flex:1;padding:11px;border:2px solid var(--navy);border-radius:8px;font:inherit;font-weight:800;background:#fff;color:var(--navy)">Ні</button>
      <button onclick="askDone(true)" style="flex:1;padding:11px;border:none;border-radius:8px;font:inherit;font-weight:800;background:var(--navy);color:#fff">Так</button>
    </div>
  </div>
</div>
<div id="failDlg">
  <div id="failBox">
    <h3>Чому не виконано?</h3>
    <div class="sub" id="failSub"></div>
    <div id="failReasons"></div>
    <input id="failTxt" placeholder="Опиши причину">
    <div id="failActions">
      <button class="cancel" onclick="closeFail()">Скасувати</button>
      <button class="confirm" onclick="doFail()">Підтвердити</button>
    </div>
  </div>

<div id="cardDlg" onclick="if(event.target===this)closeCard()">
  <div id="cardBox"></div>

<div id="toast"></div>
<script>
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('token');
const NATIVE = /TMSKultApp/.test(navigator.userAgent);   // v26: сторінка всередині APK
const $ = id => document.getElementById(id);

// ---------- v54: пілот транспортного листа ----------
let fuelPilot = false, fuelSheet = null;
const fnum = (v, d=1) => v==null ? '—' : Number(v).toLocaleString('uk-UA',{minimumFractionDigits:d,maximumFractionDigits:d});
const fuelStatus = {draft:'Чернетка',submitted:'Очікує логіста',approved:'Підтверджено',revision:'Повторна перевірка'};

async function loadTransportSheet() {
  if (!TOKEN || MODE !== 'today') return;
  try {
    const r = await fetch(`/api/driver/${TOKEN}/transport-sheet`);
    if (!r.ok) return;
    const j = await r.json(); fuelPilot = !!j.enabled; fuelSheet = j.sheet || null;
    renderTransportCard(j.error);
    maybeEveningDlg();                              // v55: вечірній тригер
  } catch(e) { /* рейси працюють незалежно від пілота */ }
}

// v55: широкої картки немає — ТЛ живе у чипі-рядку, деталі у шторці
const TL_ICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00356B" stroke-width="2" stroke-linecap="round"><path d="M4 4h12v16H4z"/><path d="M8 8h4M8 12h4M8 16h2"/><path d="M16 9h3l1.5 2V16h-4.5"/></svg>';
const PUMP_ICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h8v16H5zM5 20h8M7 4v5h4V4"/><path d="M13 9h3l2 2v6a1.5 1.5 0 0 1-3 0v-4h-2"/></svg>';
const OK_ICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E8B57" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>';

function renderTransportCard(error='') {
  document.querySelector('.tl-chip')?.remove();
  if (!fuelPilot || MODE !== 'today') return;
  const s=fuelSheet;
  let cls='', ico=TL_ICO, txt, pump=true;
  if (!s) { txt = error||'Не вдалося визначити автомобіль'; cls='warn'; pump=false; }
  else if (s.status==='approved') {
    const km = s.km!=null?fnum(s.km,0)+' км · ':'';
    ico=OK_ICO; cls='closed'; txt=`День закрито · <b>${km}залишок ${fnum(s.closing_balance_l,1)} л</b>`;
  } else if (s.status==='submitted') {

function allRoutesFinished(){
  const list = (trip && trip.routes) || [];
  return list.length>0 && list.every(x=>x.finished);
}
function tlGpsKm(){
  const list = (trip && trip.routes) || [];
  const km = list.reduce((a,x)=>a+(x.gps_km||0),0);
  return km || (trip?.route?.gps_km || 0);
}

function pickReason(btn) {
  document.querySelectorAll('.r-btn').forEach(b => b.classList.remove('sel'));

  const isOther = btn.dataset.name.trim().toLowerCase().startsWith('інше');

async function doFail() {
  if (!failCtx || !failCtx.reasonId) { toast('Обери причину'); return; }
  const txt = $('failTxt').style.display !== 'none' ? $('failTxt').value.trim() : '';
  if ($('failTxt').style.display !== 'none' && !txt) { toast('Опиши причину'); return; }
  const pos = lastPos ? {lat:lastPos.lat, lon:lastPos.lon} : {};
  for (const id of failCtx.ids.split(',')) {
    try {
      const r = await fetch(`/api/driver/${TOKEN}/stops/${id}/fail`, {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({reason_id: failCtx.reasonId, reason_text: txt || null, ...pos})});
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));

function toast(m) { const t=$('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 2500); }
const hm = ts => ts ? new Date(ts).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}) : '';
const toMin = s => { if(!s) return null; const [h,m]=s.split(':'); return +h*60 + +m; };

// подряд идущие точки одного клиент+адрес = одна остановка
function groupStops(stops) {
  const g = [];
  for (const s of stops) {
    const last = g[g.length-1];
    if (last && last.client===s.client && last.address===s.address) {
      last.items.push(s);
      if (!last.phone && s.phone) last.phone = s.phone;
      if (!last.contact_person && s.contact_person) last.contact_person = s.contact_person;
    } else g.push({client:s.client, address:s.address, address_extra:s.address_extra,
                 kind:s.kind, lat:s.lat, lon:s.lon, phone:s.phone,
                 contact_person:s.contact_person, items:[s]});
  }
  return g;
}

let MODE = 'today', nextTrip = null;

function setMode(m) {
  MODE = m;

async function loadNext() {                        // v28: рейс на наступний день

    const j = await r.json();
    nextTrips = j.trips || (j.trip ? [j.trip] : []);       // v40: кілька рейсів

function switchNext(i) {                          // v40
  if (i === selNextIdx) return;
  selNextIdx = i;
  nextTrip = nextTrips[i];

}

let _scrollTop = false;                           // v58
function switchRoute(id) {                        // v39
  if (id === selRoute) return;
  selRoute = id;
  _scrollTop = true;                              // v58: зміна рейсу — вгору свідомо
  load();

async function routeEvent(ev, force = false, skipAsk = false) {
  // v55: перший «Виїхав» дня — ранкове підтвердження одометра (1 діалог = 2 дії)
  if (ev === 'start' && needMorningConfirm()) { openMorningDlg(trip.route.id); return; }
  const Q = {depot_arrive:'Позначити прибуття на склад?',
             start:'Позначити виїзд на маршрут?', finish:'Завершити маршрут?'};
  const OK = {depot_arrive:'Прибуття на склад зафіксовано',
              start:'Гарної дороги!', finish:'Рейс завершено'};
  if (!force && !skipAsk && !await askYes(Q[ev])) return;
  const last = (typeof lastPos !== 'undefined' && lastPos) ? lastPos
             : (typeof queue !== 'undefined' && queue.length ? queue[queue.length-1] : null);
  const r = await fetch(`/api/driver/${TOKEN}/route/${trip.route.id}/event`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({event:ev, force, lat:last?.lat ?? null, lon:last?.lon ?? null})});
  if (!r.ok) { toast('Не вдалося, спробуй ще раз'); return; }
  const j = await r.json().catch(() => ({}));
  if (j.confirm_required) {                            // v44: далеко від складу
    const T = {depot_arrive:`Ти за ${fmtDist(j.dist_m)} від складу. Точно прибув на склад?`,
               start:`Ти за ${fmtDist(j.dist_m)} від складу. Точно виїжджаєш на маршрут?`,
               finish:`Ти за ${fmtDist(j.dist_m)} від складу. Точно завершити маршрут тут?`};
    if (await askYes(T[ev])) return routeEvent(ev, true);
    return;
  }
  // v53: після завершення одразу відкрити наступний незавершений рейс.
  // Поточний рейс ще має finished=false у локальних даних, тому виключаємо
  // його за id. Якщо наступного немає — лишаємось на підсумку завершеного.
  const nextRoute = ev === 'finish'
    ? (trip.routes||[]).find(x => x.id !== trip.route.id && !x.finished)
    : null;
  if (nextRoute) selRoute = nextRoute.id;
  toast(nextRoute ? 'Рейс завершено · відкрито наступний рейс' : OK[ev]);
  load();
}

let selRoute = null;                               // v39: обраний рейс (кілька на день)

async function load() {
  if (!TOKEN) { $('list').innerHTML='<div class="empty">Немає токена в посиланні</div>'; return; }
  const keepY = _scrollTop ? 0 : window.scrollY;   // v58: не скидати скрол при оновленні
  _scrollTop = false;
  let r;
  try { r = await fetch(`/api/driver/${TOKEN}/trip` + (selRoute ? `?route_id=${selRoute}` : '')); }
  catch(e) { toast('Немає зв’язку'); return; }
  if (r.status===401) { $('list').innerHTML='<div class="empty">Токен недійсний — звернись до логіста</div>'; return; }
  trip = await r.json();
  if (trip.route) selRoute = trip.route.id;        // v39: сервер міг обрати сам
  if (MODE==='today') render();
  await loadTransportSheet();                     // v54: для інших водіїв enabled=false
  loadNext();
  requestAnimationFrame(() => window.scrollTo(0, keepY));   // v58: після вставки чипа ТЛ
}

        <button class="b-unfail" onclick="unfail('${ids}')">Відмінити</button></div>` : ''}
      ${closed ? '' : `
      <div class="actions" id="act${gi}">
        <button class="b-nav" onclick="toggleNav(${gi})" aria-label="Навігація">${NAV_ARROW}</button>
        ${call}
        <a class="b-map gmap" href="${gmap}" target="_blank" rel="noopener" style="display:none" onclick="trackUi('nav_google',${g.items[0].order_id||null})">Google Maps</a>
        <a class="b-map waze" href="${waze}" target="_blank" rel="noopener" style="display:none" onclick="trackUi('nav_waze',${g.items[0].order_id||null})">Waze</a>
      </div>
      <div class="btns">
        <button class="b-arr" onclick="mark('${ids}','arrive')" ${arrived?'disabled':''}>Прибув</button>
        <button class="b-dep" onclick="mark('${ids}','depart')" ${arrived?'':'disabled'}>Поїхав</button>
        <button class="b-fail" onclick="openFail(${gi},'${ids}','${isPickup?'pickup':'delivery'}')" title="Не виконано">✗</button>
      </div>`}
    </div>`;
  }).join('') + tail || '<div class="empty">На маршруті немає точок</div>';

  const d = $('hDelay');
  if (delay == null) d.innerHTML = '';
  else if (delay > 5) d.innerHTML = `<span class="badge late">−${delay} хв</span>`;
  else d.innerHTML = `<span class="badge ok">за графіком</span>`;
}

async function mark(ids, event, force = false) {
  const pos = lastPos ? {lat:lastPos.lat, lon:lastPos.lon} : {};
  for (const id of ids.split(',')) {
    try {
      const r = await fetch(`/api/driver/${TOKEN}/stops/${id}/event`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({event, force, ...pos})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast(j.detail || 'Помилка — спробуй ще раз'); return; }
      if (j.confirm_required) {                        // v44: натискання здалеку
        const what = event === 'arrive' ? 'Точно прибув?' : 'Точно поїхав звідти?';
        if (await askYes(`Ти за ${fmtDist(j.dist_m)} від точки. ${what}`))
          return mark(ids, event, true);
        return;
      }
    } catch(e) { toast('Немає зв’язку — спробуй ще раз'); return; }
  }
  toast(event==='arrive' ? 'Прибуття зафіксовано' : 'Виїзд зафіксовано');
  await load();
}

// --- v52: браузер визначає позицію лише для кнопок, трек передає тільки APK ---
let lastPos = null;
localStorage.removeItem('gpsq');                    // прибрати чергу старих web-точок

function setGps(bars, txt) {
  const b = document.querySelectorAll('#hGps .bars i');
  b.forEach((el,i)=> el.classList.toggle('on', i < bars));
  $('hGpsTxt').textContent = txt;
}

window.nativeGps = acc => {                 // v26: APK оновлює індикатор сигналу
  const bars = acc<=15?4 : acc<=40?3 : acc<=100?2 : 1;
  setGps(bars, '±' + Math.round(acc) + ' м');
};
if (NATIVE) setGps(0, 'додаток');

if (navigator.geolocation && TOKEN && !NATIVE) {
  navigator.geolocation.watchPosition(p => {
    lastPos = {lat:p.coords.latitude, lon:p.coords.longitude};
    const acc = p.coords.accuracy;                    // менше метрів = кращий сигнал
    const bars = acc<=15?4 : acc<=40?3 : acc<=100?2 : 1;
    setGps(bars, '±' + Math.round(acc) + ' м');
  }, e => { setGps(0, 'вимкнено'); },
  {enableHighAccuracy:true, maximumAge:10000});
}

setInterval(load, 60000);          // автооновлення плану
load();

// ---------- v33: потягни вниз — онови ----------
let _pt = {y0:null, ready:false};
document.addEventListener('touchstart', e => {
  if (window.scrollY === 0 && $('tmap').style.display !== 'block')
    _pt.y0 = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (_pt.y0 == null || window.scrollY > 0) return;
  const d = e.touches[0].clientY - _pt.y0;
  if (d <= 0) return;
  _pt.ready = d > 70;
  $('ptr').style.height = Math.min(d/2, 46) + 'px';
  $('ptr').textContent = _pt.ready ? 'Відпусти — оновлю' : '↓ Потягни, щоб оновити';
}, {passive:true});
document.addEventListener('touchend', async () => {
  const doIt = _pt.ready;
  _pt = {y0:null, ready:false};
  if (doIt) {
    $('ptr').textContent = 'Оновлюю…';
    await load();
    toast('Оновлено');
  }
  $('ptr').style.height = '0';
});

// ---------- v32: карта завтрашнього маршруту ----------
let _leafletReady = null, _tMap = null;
function loadLeaflet() {
  if (_leafletReady) return _leafletReady;
  _leafletReady = new Promise(res => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = res; document.head.appendChild(js);
  });
  return _leafletReady;
}
async function openTomorrowMap() {
  if (!nextTrip) return;
  $('tmap').style.display = 'block';
  await loadLeaflet();
  if (_tMap) { _tMap.remove(); _tMap = null; }
  _tMap = L.map('tmapCanvas');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(_tMap);
  const pts = [];
  const groups = groupStops(nextTrip.stops);
  groups.forEach((g, gi) => {
    if (g.lat == null) return;
    pts.push([g.lat, g.lon]);
    L.marker([g.lat, g.lon], {icon: L.divIcon({className:'',
      html:`<div style="width:26px;height:26px;border-radius:50%;background:#00356B;color:#fff;display:flex;align-items:center;justify-content:center;font:800 13px 'Open Sans',sans-serif;box-shadow:0 0 0 2px #fff">${gi+1}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]})})
     .bindTooltip(`${gi+1}. ${g.client}<br>${g.items[0].eta||''}`)
     .addTo(_tMap);
  });
  if (nextTrip.depot && nextTrip.depot.lat != null) {
    const sB = {depot:'С', home:'Д', custom:'А'}[nextTrip.depot.kind || 'depot'] || 'С';   // v51
    pts.push([nextTrip.depot.lat, nextTrip.depot.lon]);
    L.marker([nextTrip.depot.lat, nextTrip.depot.lon], {icon: L.divIcon({className:'',
      html:`<div style="width:26px;height:26px;border-radius:6px;background:#E82A2C;color:#fff;display:flex;align-items:center;justify-content:center;font:800 13px 'Open Sans',sans-serif;box-shadow:0 0 0 2px #fff">${sB}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]})})
     .bindTooltip('Старт: ' + (nextTrip.depot.name || 'Склад')).addTo(_tMap);
  }
  const fin = nextTrip.finish;                                       // v51: фініш ≠ старт
  if (fin && fin.lat != null && nextTrip.depot
      && (fin.lat !== nextTrip.depot.lat || fin.lon !== nextTrip.depot.lon)) {
    const fB = {depot:'С', home:'Д', custom:'А'}[fin.kind || 'depot'] || 'С';
    pts.push([fin.lat, fin.lon]);
    L.marker([fin.lat, fin.lon], {icon: L.divIcon({className:'',
      html:`<div style="width:26px;height:26px;border-radius:6px;background:#00356B;color:#fff;display:flex;align-items:center;justify-content:center;font:800 13px 'Open Sans',sans-serif;box-shadow:0 0 0 2px #fff">${fB}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]})})
     .bindTooltip('Фініш: ' + (fin.name || '')).addTo(_tMap);
  }
  if (nextTrip.geometry && nextTrip.geometry.length > 1)
    L.polyline(nextTrip.geometry, {color:'#00356B', weight:3, opacity:.8}).addTo(_tMap);
  else if (pts.length > 1)
    L.polyline(pts, {color:'#00356B', weight:2.5, dashArray:'6 5', opacity:.7}).addTo(_tMap);
  if (pts.length) _tMap.fitBounds(pts, {padding:[30,30]});
}
function closeTomorrowMap() { $('tmap').style.display = 'none'; }
</script>
</body>
